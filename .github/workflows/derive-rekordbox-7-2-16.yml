name: derive-rekordbox-7-2-16-offsets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/derive-rekordbox-7-2-16.yml

permissions:
  contents: write

concurrency:
  group: derive-rekordbox-7-2-16
  cancel-in-progress: true

jobs:
  derive:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify official installers
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/rb-installers /tmp/rb-offset-evidence
          {
            curl --fail --location --retry 3 --retry-all-errors \
              --output /tmp/rb-installers/rb-7.2.14.zip \
              'https://cdn.rekordbox.com/files/20260401164249/Install_rekordbox_7_2_14.pkg_.zip'
            curl --fail --location --retry 3 --retry-all-errors \
              --output /tmp/rb-installers/rb-7.2.16.zip \
              'https://cdn.rekordbox.com/files/20260708182003/Install_rekordbox_7_2_16.pkg_.zip'
            printf '%s  %s\n' \
              '82e23297ef8dd555a3d134bc57f9a36a22f715f4972c059706f6d1d3e300c020' /tmp/rb-installers/rb-7.2.14.zip \
              'b1007870c5560fb0bfb56c75a125b80df4d413b6d3afca1935be8b1cb4613a99' /tmp/rb-installers/rb-7.2.16.zip \
              | shasum -a 256 -c -
          } 2>&1 | tee /tmp/rb-offset-evidence/download.txt

      - name: Extract and derive
        id: derive
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            for version in 7.2.14 7.2.16; do
              work="/tmp/rb-${version}"
              mkdir -p "$work/zip"
              ditto -x -k "/tmp/rb-installers/rb-${version}.zip" "$work/zip"
              pkg="$(find "$work/zip" \( -type d -o -type f \) -name '*.pkg' -print -quit)"
              test -n "$pkg"
              pkgutil --expand-full "$pkg" "$work/pkg-expanded"
              binary="$(find "$work/pkg-expanded" -type f -path '*/rekordbox.app/Contents/MacOS/rekordbox' -print -quit)"
              test -n "$binary"
              cp "$binary" "$work/rekordbox-universal"
              lipo "$binary" -thin arm64 -output "$work/rekordbox-arm64"
              chmod +x "$work/rekordbox-arm64"
              echo "=== ${version} ==="
              file "$work/rekordbox-arm64"
              shasum -a 256 "$work/rekordbox-universal"
              python3 tools/rekordbox_derive_offsets.py --binary "$work/rekordbox-universal"
              nm -arch arm64 -n --defined-only "$work/rekordbox-universal" > "/tmp/rb-offset-evidence/${version}-nm.txt"
            done
          } 2>&1 | tee /tmp/rb-offset-evidence/derive.txt

      - name: Trace matching-function global references
        id: xrefs
        if: steps.derive.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cat > /tmp/trace-rb-xrefs.py <<'PY'
          from __future__ import annotations
          import bisect, struct, traceback
          from dataclasses import dataclass
          from pathlib import Path

          LC_SEGMENT_64=0x19
          IMAGE_BASE=0x100000000
          KNOWN_ROOT=IMAGE_BASE+0x04E0BFE0
          GLOBAL_LO=IMAGE_BASE+0x04B00000
          GLOBAL_HI=IMAGE_BASE+0x04F10000

          @dataclass
          class Sym:
              addr:int; typ:str; name:str

          def macho_text(path:str):
              data=Path(path).read_bytes()
              hdr=struct.unpack_from('<IiiIIIII',data,0)
              if hdr[0] != 0xFEEDFACF: raise RuntimeError(f'bad Mach-O magic {hdr[0]:#x}')
              off=32
              for _ in range(hdr[4]):
                  cmd,cmdsize=struct.unpack_from('<II',data,off)
                  if cmd==LC_SEGMENT_64:
                      seg=struct.unpack_from('<II16sQQQQiiII',data,off)
                      so=off+72
                      for _ in range(seg[9]):
                          sec=struct.unpack_from('<16s16sQQ8I',data,so)
                          sn=sec[0].split(b'\0',1)[0]; sg=sec[1].split(b'\0',1)[0]
                          if sn==b'__text' and sg==b'__TEXT': return sec[2],data[sec[4]:sec[4]+sec[3]]
                          so+=80
                  off+=cmdsize
              raise RuntimeError('missing __TEXT,__text')

          def parse_nm(path:str):
              out=[]
              for line in Path(path).read_text(errors='replace').splitlines():
                  p=line.split(' ',2)
                  if len(p)!=3: continue
                  try:a=int(p[0],16)
                  except ValueError: continue
                  out.append(Sym(a,p[1],p[2]))
              return out

          def sext(v,bits):
              s=1<<(bits-1); return (v^s)-s

          def adrp(word,pc):
              if word & 0x9F000000 != 0x90000000: return None
              imm=sext((((word>>5)&0x7ffff)<<2)|((word>>29)&3),21)<<12
              return (pc&~0xfff)+imm,word&31

          def scan(text,code,start=None,end=None,page=None):
              words=memoryview(code).cast('I')
              lo=max(0,((start or text)-text)//4)
              hi=min(len(words),((end or (text+len(code)))-text+3)//4)
              out=[]
              for i in range(lo,hi):
                  pc=text+i*4; a=adrp(words[i],pc)
                  if not a: continue
                  pg,rd=a
                  if page is not None and pg!=page: continue
                  tracked={rd:pg}
                  for j in range(i+1,min(i+13,hi)):
                      w=words[j]; ipc=text+j*4
                      # ADD immediate.
                      if w&0x7F000000==0x11000000 and ((w>>30)&1)==0:
                          rn=(w>>5)&31; dst=w&31
                          if rn in tracked:
                              val=tracked[rn]+(((w>>10)&0xfff)<<(12 if ((w>>22)&1) else 0))
                              out.append((ipc,val,'add')); tracked[dst]=val
                      # Unsigned-immediate load/store.
                      if w&0x3B000000==0x39000000:
                          rn=(w>>5)&31
                          if rn in tracked:
                              val=tracked[rn]+((w>>10)&0xfff)*(1<<((w>>30)&3))
                              out.append((ipc,val,'mem_uimm'))
                      # Unscaled load/store.
                      if w&0x3B200C00==0x38000000:
                          rn=(w>>5)&31
                          if rn in tracked:
                              out.append((ipc,tracked[rn]+sext((w>>12)&0x1ff,9),'mem_unscaled'))
                      na=adrp(w,ipc)
                      if na: tracked[na[1]]=na[0]
              seen=set(); dedup=[]
              for r in out:
                  if r not in seen: seen.add(r); dedup.append(r)
              return dedup

          class Bin:
              def __init__(self,binary,nm):
                  self.text,self.code=macho_text(binary)
                  self.funcs=sorted([s for s in parse_nm(nm) if s.typ in ('t','T')],key=lambda s:s.addr)
                  self.addrs=[s.addr for s in self.funcs]
                  self.names={}
                  for i,s in enumerate(self.funcs): self.names.setdefault(s.name,[]).append(i)
              def fi(self,addr): return bisect.bisect_right(self.addrs,addr)-1
              def bounds(self,i): return self.funcs[i].addr,(self.funcs[i+1].addr if i+1<len(self.funcs) else self.text+len(self.code))
              def refs(self,i):
                  a,b=self.bounds(i)
                  return [r for r in scan(self.text,self.code,a,b) if GLOBAL_LO<=r[1]<=GLOBAL_HI]

          try:
              a=Bin('/tmp/rb-7.2.14/rekordbox-arm64','/tmp/rb-offset-evidence/7.2.14-nm.txt')
              b=Bin('/tmp/rb-7.2.16/rekordbox-arm64','/tmp/rb-offset-evidence/7.2.16-nm.txt')
              page_refs=scan(a.text,a.code,page=KNOWN_ROOT&~0xfff)
              source=[r for r in page_refs if r[1]==KNOWN_ROOT]
              near=[r for r in page_refs if abs(r[1]-KNOWN_ROOT)<=0x80]
              if not source: source=near
              print(f'known=0x{KNOWN_ROOT:x} page_refs={len(page_refs)} exact={sum(r[1]==KNOWN_ROOT for r in page_refs)} near={len(near)}')
              if not source: raise RuntimeError('no known-root xref decoded')
              votes=[]
              for ref in source:
                  ai=a.fi(ref[0]); sym=a.funcs[ai]
                  ar=a.refs(ai)
                  exact_indices=[i for i,r in enumerate(ar) if r[0]==ref[0] and r[1]==ref[1]]
                  print(f'\nSOURCE ins=0x{ref[0]:x} kind={ref[2]} function={sym.name} start=0x{sym.addr:x}')
                  print(f'7.2.14 high_refs={len(ar)} exact_indices={exact_indices}')
                  for i,r in enumerate(ar):
                      if any(abs(i-x)<=5 for x in exact_indices): print(f'  A[{i}] rel=0x{r[0]-sym.addr:x} rva=0x{r[1]-IMAGE_BASE:08X} {r[2]}')
                  for bi in b.names.get(sym.name,[]):
                      bs=b.funcs[bi]; br=b.refs(bi)
                      print(f'7.2.16 function start=0x{bs.addr:x} high_refs={len(br)}')
                      for idx in exact_indices:
                          for j in range(max(0,idx-5),min(len(br),idx+6)):
                              r=br[j]
                              print(f'  B[{j}] rel=0x{r[0]-bs.addr:x} rva=0x{r[1]-IMAGE_BASE:08X} {r[2]}')
                          if idx<len(br): votes.append(br[idx][1])
              from collections import Counter
              print('\nSAME_ORDINAL_VOTES')
              for addr,n in Counter(votes).most_common(): print(f'0x{addr-IMAGE_BASE:08X} count={n}')
          except Exception:
              traceback.print_exc()
              raise
          PY
          set -o pipefail
          python3 /tmp/trace-rb-xrefs.py 2>&1 | tee /tmp/rb-offset-evidence/xrefs.txt

      - name: Commit diagnostic report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rb-offset-evidence
          report='docs/data/rekordbox-7.2.16-offset-evidence.txt'
          {
            echo '# Temporary 7.2.16 derivation evidence'
            echo "run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} sha=${GITHUB_SHA}"
            echo "download_outcome=${{ steps.download.outcome }} derive_outcome=${{ steps.derive.outcome }} xrefs_outcome=${{ steps.xrefs.outcome }}"
            echo
            for f in download derive xrefs; do
              echo "=== ${f} ==="
              cat "/tmp/rb-offset-evidence/${f}.txt" 2>/dev/null || echo '(no output)'
              echo
            done
          } > "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "$report"
          git commit -m 'chore(data): record diagnostic 7.2.16 xrefs' || exit 0
          git push
