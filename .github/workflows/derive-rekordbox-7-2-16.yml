name: derive-rekordbox-7-2-16-offsets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/derive-rekordbox-7-2-16.yml

permissions:
  contents: write

jobs:
  derive:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify official installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rb-installers
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/rb-installers/rb-7.2.14.zip \
            'https://cdn.rekordbox.com/files/20260401164249/Install_rekordbox_7_2_14.pkg_.zip'
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/rb-installers/rb-7.2.16.zip \
            'https://cdn.rekordbox.com/files/20260708182003/Install_rekordbox_7_2_16.pkg_.zip'
          printf '%s  %s\n' \
            '82e23297ef8dd555a3d134bc57f9a36a22f715f4972c059706f6d1d3e300c020' /tmp/rb-installers/rb-7.2.14.zip \
            'b1007870c5560fb0bfb56c75a125b80df4d413b6d3afca1935be8b1cb4613a99' /tmp/rb-installers/rb-7.2.16.zip \
            | shasum -a 256 -c -

      - name: Extract arm64 binaries
        shell: bash
        run: |
          set -euo pipefail
          for version in 7.2.14 7.2.16; do
            work="/tmp/rb-${version}"
            mkdir -p "$work/zip"
            ditto -x -k "/tmp/rb-installers/rb-${version}.zip" "$work/zip"
            pkg="$(find "$work/zip" \( -type d -o -type f \) -name '*.pkg' -print -quit)"
            test -n "$pkg"
            pkgutil --expand-full "$pkg" "$work/pkg-expanded"
            binary="$(find "$work/pkg-expanded" -type f -path '*/rekordbox.app/Contents/MacOS/rekordbox' -print -quit)"
            test -n "$binary"
            cp "$binary" "$work/rekordbox-universal"
            lipo "$binary" -thin arm64 -output "$work/rekordbox-arm64"
            chmod +x "$work/rekordbox-arm64"
            file "$work/rekordbox-arm64"
          done

      - name: Derive symbol-backed anchors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rb-offset-evidence
          for version in 7.2.14 7.2.16; do
            binary="/tmp/rb-${version}/rekordbox-universal"
            {
              echo "=== rekordbox ${version} ==="
              shasum -a 256 "$binary"
              python3 tools/rekordbox_derive_offsets.py --binary "$binary"
              echo '=== anchor symbols ==='
              nm -arch arm64 -n --defined-only "$binary" | grep -E '__ZN15ApplicationMode15singletonHolderE|__ZN6browse21LoadedContentsManager15singletonHolderE|__ZN8djengine10DjEngineIF15singletonHolderE'
            } | tee "/tmp/rb-offset-evidence/${version}-anchors.txt"
            nm -arch arm64 -n --defined-only "$binary" > "/tmp/rb-offset-evidence/${version}-nm.txt"
          done

      - name: Trace deck-root code references across versions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet capstone==5.0.6
          cat > /tmp/trace-rb-xrefs.py <<'PY'
          from __future__ import annotations
          import bisect, difflib, re, struct
          from dataclasses import dataclass
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          from capstone.arm64 import ARM64_INS_ADRP, ARM64_INS_ADD, ARM64_OP_REG, ARM64_OP_IMM, ARM64_OP_MEM

          LC_SEGMENT_64=0x19
          IMAGE_BASE=0x100000000
          KNOWN_14=IMAGE_BASE+0x04E0BFE0

          @dataclass
          class Sym:
              addr:int; typ:str; name:str

          def text_section(path:str):
              data=Path(path).read_bytes()
              magic,_,_,_,ncmds,_,_,_=struct.unpack_from('<IiiIIIII',data,0)
              if magic != 0xFEEDFACF: raise RuntimeError(f'bad Mach-O magic {magic:#x}')
              off=32
              for _ in range(ncmds):
                  cmd,cmdsize=struct.unpack_from('<II',data,off)
                  if cmd==LC_SEGMENT_64:
                      _,_,segraw,_,_,_,_,_,_,nsects,_=struct.unpack_from('<II16sQQQQiiII',data,off)
                      so=off+72
                      for _ in range(nsects):
                          sectraw,secseg,addr,size,fileoff,*_=struct.unpack_from('<16s16sQQ8I',data,so)
                          sect=sectraw.split(b'\0',1)[0].decode(); seg=secseg.split(b'\0',1)[0].decode()
                          if seg=='__TEXT' and sect=='__text':
                              return addr,data[fileoff:fileoff+size]
                          so+=80
                  off+=cmdsize
              raise RuntimeError('no __TEXT,__text')

          def symbols(path:str):
              out=[]
              for line in Path(path).read_text(errors='replace').splitlines():
                  p=line.split(' ',2)
                  if len(p)!=3: continue
                  try:a=int(p[0],16)
                  except ValueError:continue
                  out.append(Sym(a,p[1],p[2]))
              return out

          class Binary:
              def __init__(self,binpath,nmpath):
                  self.base,self.code=text_section(binpath)
                  md=Cs(CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN); md.detail=True
                  self.ins=list(md.disasm(self.code,self.base))
                  self.byaddr={x.address:i for i,x in enumerate(self.ins)}
                  self.syms=symbols(nmpath)
                  self.funcs=sorted([s for s in self.syms if s.typ in ('t','T')],key=lambda s:s.addr)
                  self.faddrs=[s.addr for s in self.funcs]
                  self.func_by_name={}
                  for i,s in enumerate(self.funcs): self.func_by_name.setdefault(s.name,[]).append(i)
                  self.refs=self._refs()
                  self.refs_by_addr={}
                  for r in self.refs:self.refs_by_addr.setdefault(r[0],[]).append(r)
              def func_index_for(self,addr):
                  i=bisect.bisect_right(self.faddrs,addr)-1
                  return i if i>=0 else None
              def func_range(self,i):
                  start=self.funcs[i].addr
                  end=self.funcs[i+1].addr if i+1<len(self.funcs) else self.base+len(self.code)
                  a=bisect.bisect_left([x.address for x in self.ins],start)
                  b=bisect.bisect_left([x.address for x in self.ins],end)
                  return a,b
              def _refs(self):
                  refs=[]; tracked={}
                  for idx,ins in enumerate(self.ins):
                      tracked={r:v for r,v in tracked.items() if idx-v[1] <= 12}
                      ops=ins.operands
                      # Memory access based on a recent ADRP/ADD address base.
                      for op in ops:
                          if op.type==ARM64_OP_MEM and op.mem.base in tracked:
                              target=tracked[op.mem.base][0]+op.mem.disp
                              refs.append((ins.address,target,'mem',ins.mnemonic,ins.op_str))
                      new=[]
                      if ins.id==ARM64_INS_ADD and len(ops)>=3 and ops[0].type==ARM64_OP_REG and ops[1].type==ARM64_OP_REG and ops[2].type==ARM64_OP_IMM and ops[1].reg in tracked:
                          target=tracked[ops[1].reg][0]+ops[2].imm
                          refs.append((ins.address,target,'add',ins.mnemonic,ins.op_str))
                          new.append((ops[0].reg,target))
                      try:_,writes=ins.regs_access()
                      except Exception:writes=[]
                      for r in writes:tracked.pop(r,None)
                      if ins.id==ARM64_INS_ADRP and len(ops)>=2 and ops[0].type==ARM64_OP_REG and ops[1].type==ARM64_OP_IMM:
                          tracked[ops[0].reg]=(ops[1].imm,idx)
                      for r,target in new:tracked[r]=(target,idx)
                  return refs
              def norm(self,ins):
                  s=ins.mnemonic+' '+ins.op_str
                  s=re.sub(r'#-?0x[0-9a-f]+|#-?\d+','#IMM',s)
                  return s
              def function_payload(self,i):
                  a,b=self.func_range(i)
                  ins=self.ins[a:b]
                  local={x.address:j for j,x in enumerate(ins)}
                  refs=[]
                  for r in self.refs:
                      if a < len(self.ins) and self.ins[a].address <= r[0] < (self.ins[b].address if b<len(self.ins) else 1<<64):
                          refs.append((local.get(r[0]),r))
                  return ins,refs

          b14=Binary('/tmp/rb-7.2.14/rekordbox-arm64','/tmp/rb-offset-evidence/7.2.14-nm.txt')
          b16=Binary('/tmp/rb-7.2.16/rekordbox-arm64','/tmp/rb-offset-evidence/7.2.16-nm.txt')
          known=[r for r in b14.refs if r[1]==KNOWN_14]
          near=[r for r in b14.refs if abs(r[1]-KNOWN_14)<=0x40]
          print(f'known_root=0x{KNOWN_14:x} exact_xrefs={len(known)} near_xrefs={len(near)}')
          source=known or near
          candidates=[]
          for r in source:
              fi=b14.func_index_for(r[0]); fs=b14.funcs[fi]
              print(f'\n7.2.14 xref ins=0x{r[0]:x} target=0x{r[1]:x} kind={r[2]} {r[3]} {r[4]}')
              print(f'  function={fs.name} start=0x{fs.addr:x}')
              same=b16.func_by_name.get(fs.name,[])
              if not same:
                  print('  7.2.16 same function: MISSING'); continue
              ins14,refs14=b14.function_payload(fi)
              li=next((j for j,x in enumerate(ins14) if x.address==r[0]),None)
              for fj in same:
                  ins16,refs16=b16.function_payload(fj)
                  seq14=[b14.norm(x) for x in ins14]
                  seq16=[b16.norm(x) for x in ins16]
                  sm=difflib.SequenceMatcher(None,seq14,seq16,autojunk=False)
                  mapped=[]
                  for block in sm.get_matching_blocks():
                      if block.a <= li < block.a+block.size:
                          mapped.append(block.b+(li-block.a))
                  print(f'  7.2.16 function start=0x{b16.funcs[fj].addr:x} ins14={len(ins14)} ins16={len(ins16)} ratio={sm.ratio():.4f} mapped={mapped}')
                  refmap={idx:rr for idx,rr in refs16 if idx is not None}
                  for m in mapped:
                      for k in range(max(0,m-3),min(len(ins16),m+4)):
                          rr=refmap.get(k)
                          if rr:
                              print(f'    mapped_ref idx={k} ins=0x{rr[0]:x} target=0x{rr[1]:x} rva=0x{rr[1]-IMAGE_BASE:08x} kind={rr[2]} {rr[3]} {rr[4]}')
                              if 0x04D00000 <= rr[1]-IMAGE_BASE <= 0x04F10000:
                                  candidates.append(rr[1])
          from collections import Counter
          print('\nCANDIDATE_COUNTS')
          for addr,n in Counter(candidates).most_common(): print(f'0x{addr-IMAGE_BASE:08X} count={n}')
          if not source: raise SystemExit('No static xref found to known 7.2.14 deck root')
          PY
          python3 /tmp/trace-rb-xrefs.py | tee /tmp/rb-offset-evidence/deck-xrefs.txt

      - name: Commit compact evidence report
        shell: bash
        run: |
          set -euo pipefail
          report='docs/data/rekordbox-7.2.16-offset-evidence.txt'
          {
            echo '# Generated by .github/workflows/derive-rekordbox-7-2-16.yml'
            echo '# Official installer hashes verified before extraction.'
            echo
            cat /tmp/rb-offset-evidence/7.2.14-anchors.txt
            echo
            cat /tmp/rb-offset-evidence/7.2.16-anchors.txt
            echo
            cat /tmp/rb-offset-evidence/deck-xrefs.txt
          } > "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'chore(data): record 7.2.16 deck-root xrefs'
          git push
