name: derive-rekordbox-7-2-16-offsets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/derive-rekordbox-7-2-16.yml

permissions:
  contents: write

concurrency:
  group: derive-rekordbox-7-2-16
  cancel-in-progress: true

jobs:
  derive:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify, and extract app bundles
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/rb-installers /tmp/rb-offset-evidence
          {
            curl --fail --location --retry 3 --retry-all-errors \
              -o /tmp/rb-installers/rb-7.2.14.zip \
              'https://cdn.rekordbox.com/files/20260401164249/Install_rekordbox_7_2_14.pkg_.zip'
            curl --fail --location --retry 3 --retry-all-errors \
              -o /tmp/rb-installers/rb-7.2.16.zip \
              'https://cdn.rekordbox.com/files/20260708182003/Install_rekordbox_7_2_16.pkg_.zip'
            printf '%s  %s\n' \
              '82e23297ef8dd555a3d134bc57f9a36a22f715f4972c059706f6d1d3e300c020' /tmp/rb-installers/rb-7.2.14.zip \
              'b1007870c5560fb0bfb56c75a125b80df4d413b6d3afca1935be8b1cb4613a99' /tmp/rb-installers/rb-7.2.16.zip \
              | shasum -a 256 -c -
            for version in 7.2.14 7.2.16; do
              work="/tmp/rb-${version}"
              mkdir -p "$work/zip"
              ditto -x -k "/tmp/rb-installers/rb-${version}.zip" "$work/zip"
              pkg="$(find "$work/zip" \( -type d -o -type f \) -name '*.pkg' -print -quit)"
              test -n "$pkg"
              pkgutil --expand-full "$pkg" "$work/pkg-expanded"
              src="$(find "$work/pkg-expanded" -type d -path '*/rekordbox.app' -print -quit)"
              test -n "$src"
              app="/Applications/rekordbox-${version}.app"
              sudo rm -rf "$app"
              sudo ditto "$src" "$app"
              echo "$app" > "$work/app-path"
              file "$app/Contents/MacOS/rekordbox"
            done
          } 2>&1 | tee /tmp/rb-offset-evidence/extract.txt

      - name: Create passive chain probe and audio file
        if: steps.extract.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          import math, struct, wave
          rate=44100; seconds=8
          with wave.open('/tmp/rb-probe.wav','wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate)
              frames=[]
              for i in range(rate*seconds):
                  phase=i%22050
                  amp=12000 if phase<400 else 0
                  sample=int(amp*math.sin(2*math.pi*1000*i/rate))
                  frames.append(struct.pack('<hh',sample,sample))
              w.writeframes(b''.join(frames))
          PY
          cat > /tmp/rb-chain-probe.py <<'PY'
          import argparse, ctypes, math, re, struct, subprocess, time
          lib=ctypes.CDLL('/usr/lib/libSystem.B.dylib',use_errno=True)
          selfvar=ctypes.c_uint32.in_dll(lib,'mach_task_self_')
          tfp=lib.task_for_pid; tfp.restype=ctypes.c_int
          tfp.argtypes=[ctypes.c_uint32,ctypes.c_int,ctypes.POINTER(ctypes.c_uint32)]
          vm=lib.mach_vm_read_overwrite; vm.restype=ctypes.c_int
          vm.argtypes=[ctypes.c_uint32,ctypes.c_uint64,ctypes.c_uint64,ctypes.c_uint64,ctypes.POINTER(ctypes.c_uint64)]
          def task(pid):
              x=ctypes.c_uint32(); kr=tfp(selfvar.value,pid,ctypes.byref(x))
              if kr: raise OSError(f'task_for_pid kr={kr}')
              return x.value
          def rb(t,a,n):
              b=(ctypes.c_uint8*n)(); got=ctypes.c_uint64()
              kr=vm(t,a,n,ctypes.addressof(b),ctypes.byref(got))
              if kr or got.value!=n: raise OSError(f'read 0x{a:x}/{n} kr={kr} got={got.value}')
              return bytes(b)
          def u64(t,a): return struct.unpack('<Q',rb(t,a,8))[0]
          def i64(t,a): return struct.unpack('<q',rb(t,a,8))[0]
          def f32(t,a): return struct.unpack('<f',rb(t,a,4))[0]
          def u8(t,a): return rb(t,a,1)[0]
          def base(pid):
              s=subprocess.run(['vmmap','--wide',str(pid)],capture_output=True,text=True,check=True).stdout
              m=re.search(r'Load Address:\s*0x([0-9a-fA-F]+)',s)
              if m:return int(m.group(1),16)
              for line in s.splitlines():
                  if 'rekordbox' in line and '__TEXT' in line:
                      m=re.match(r'\s*([0-9a-fA-F]+)-',line)
                      if m:return int(m.group(1),16)
              raise RuntimeError('no base')
          def walk(t,b,hops,final):
              a=b; trace=[]
              for i,h in enumerate(hops):
                  loc=a+h; p=u64(t,loc); trace.append((i,h,loc,p))
                  if not p: raise RuntimeError(f'null hop={i} loc=0x{loc:x}')
                  a=p
              return a+final,trace
          def chain(t,b,name,hops,final,kind):
              try:
                  a,tr=walk(t,b,hops,final)
                  if kind=='u8':v=u8(t,a)
                  elif kind=='f32':v=f32(t,a)
                  elif kind=='i64':v=i64(t,a)
                  elif kind=='ptr':v=u64(t,a)
                  else:v=rb(t,a,48).hex()
                  print(f'CHAIN {name} OK final=0x{a:x} value={v!r}')
                  for i,h,l,p in tr:print(f'  hop{i} +0x{h:x} @0x{l:x} -> 0x{p:x}')
                  return True
              except Exception as e:
                  print(f'CHAIN {name} FAIL {e}')
                  return False
          p=argparse.ArgumentParser();p.add_argument('--pid',type=int,required=True);p.add_argument('--version',required=True);a=p.parse_args()
          roots={'7.2.14':(0x04E514D8,0x04E0BFE0,0x04E51F08),'7.2.16':(0x04EE71D8,0x04EA17A0,0x04EE7C08)}
          master,deck,anlz=roots[a.version]; t=task(a.pid); b=base(a.pid)
          print(f'VERSION={a.version} PID={a.pid} BASE=0x{b:x} TASK={t}')
          print(f'ROOTS master=0x{master:08X} deck=0x{deck:08X} anlz=0x{anlz:08X}')
          for attempt in range(18):
              print(f'\nATTEMPT {attempt}')
              for n,r in [('master_root',master),('deck_root',deck),('anlz_root',anlz)]:
                  try:print(f'ROOT {n} @0x{b+r:x} -> 0x{u64(t,b+r):x}')
                  except Exception as e:print(f'ROOT {n} FAIL {e}')
              chain(t,b,'master',[master,0x20,0x278],0x124,'u8')
              mids=(0x88,0x70,0x48,0x48); slots=(0,8,0x10,0x18); asl=(8,0x10,0x18,0x20)
              successes=0
              for d,(s,m,q) in enumerate(zip(slots,mids,asl)):
                  successes+=chain(t,b,f'd{d}.bpm',[deck,s,0x2c8],0x188,'f32')
                  successes+=chain(t,b,f'd{d}.pos',[deck,s,0x2c8],0x120,'i64')
                  successes+=chain(t,b,f'd{d}.track',[deck,s,0x270,0x38,m,0x28,0xf0],0,'bytes')
                  successes+=chain(t,b,f'd{d}.anlz',[anlz,q],0x3f0,'ptr')
              print(f'SUCCESS_COUNT={successes}/16')
              time.sleep(5)
          PY

      - name: Launch through LaunchServices and probe
        id: probe
        if: steps.extract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cat > /tmp/rb-entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.get-task-allow</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict></plist>
          PLIST
          for version in 7.2.14 7.2.16; do
            app="$(cat /tmp/rb-${version}/app-path)"
            out="/tmp/rb-offset-evidence/${version}-launchservices.txt"
            {
              echo "=== ${version} ==="
              pkill -x rekordbox 2>/dev/null || true
              pkill -f rekordboxAgent 2>/dev/null || true
              sudo codesign --force --deep --sign - --entitlements /tmp/rb-entitlements.plist "$app"
              codesign -d --entitlements - "$app" 2>&1
              open -na "$app"
              pid=''
              for _ in $(seq 1 60); do
                pid="$(pgrep -x rekordbox | tail -1 || true)"
                [[ -n "$pid" ]] && break
                sleep 1
              done
              echo "PID=$pid"
              test -n "$pid"
              sleep 10
              open -a "$app" /tmp/rb-probe.wav || true
              python3 /tmp/rb-chain-probe.py --pid "$pid" --version "$version"
              pkill -x rekordbox 2>/dev/null || true
              pkill -f rekordboxAgent 2>/dev/null || true
              sleep 3
            } 2>&1 | tee "$out"
          done

      - name: Commit LaunchServices probe report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report='docs/data/rekordbox-7.2.16-offset-evidence.txt'
          {
            echo '# Temporary LaunchServices chain probe'
            echo "run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA}"
            echo "extract_outcome=${{ steps.extract.outcome }} probe_outcome=${{ steps.probe.outcome }}"
            echo
            cat /tmp/rb-offset-evidence/extract.txt 2>/dev/null || true
            echo
            cat /tmp/rb-offset-evidence/7.2.14-launchservices.txt 2>/dev/null || true
            echo
            cat /tmp/rb-offset-evidence/7.2.16-launchservices.txt 2>/dev/null || true
          } > "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "$report"
          git commit -m 'chore(data): record LaunchServices 7.2.16 probe' || exit 0
          git push
