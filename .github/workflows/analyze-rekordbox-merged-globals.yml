name: analyze-rekordbox-merged-globals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/analyze-rekordbox-merged-globals.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find exact root-neighborhood motif
        shell: bash
        run: |
          set -euo pipefail
          git show 5bde2cd92d19cd01c9ad35af331463307d83560e:docs/data/rekordbox-7.2.16-offset-evidence.txt > /tmp/full-evidence.txt
          python3 - <<'PY' > docs/data/rekordbox-7.2.16-merged-alignment.txt
          from pathlib import Path
          lines=Path('/tmp/full-evidence.txt').read_text().splitlines()
          rows={'7.2.14':[],'7.2.16':[]}; cur=None
          for line in lines:
              if line.startswith('=== rekordbox 7.2.14 ==='): cur='7.2.14'; continue
              if line.startswith('=== rekordbox 7.2.16 ==='): cur='7.2.16'; continue
              if line.startswith('=== 7.2.14 symbols'): cur=None
              if cur and '__MergedGlobals' in line:
                  p=line.split()
                  try: rows[cur].append((int(p[0],16),p[1],p[2]))
                  except (ValueError,IndexError): pass
          a,b=rows['7.2.14'],rows['7.2.16']
          known_symbol=0x104E0BFF8; known_root=known_symbol-0x18
          center=next(i for i,r in enumerate(a) if r[0]==known_symbol)
          ga=[a[i+1][0]-a[i][0] for i in range(len(a)-1)]
          gb=[b[i+1][0]-b[i][0] for i in range(len(b)-1)]
          # Include two intervals before the symbol and 30 after it. This captures
          # the distinctive 0x288,0x268 lead-in and the mixed 0x240/0x2b0/0x388 tail.
          start=center-2; motif=ga[start:center+31]
          matches=[]
          for i in range(len(gb)-len(motif)+1):
              if gb[i:i+len(motif)]==motif:
                  candidate_symbol_index=i+2
                  matches.append((candidate_symbol_index,b[candidate_symbol_index]))
          print('# Rekordbox 7.2.16 exact merged-global root-neighborhood match')
          print(f'rows_7_2_14={len(a)} rows_7_2_16={len(b)}')
          print(f'known_7_2_14_symbol_index={center} symbol_rva=0x{known_symbol-0x100000000:08X} root_rva=0x{known_root-0x100000000:08X}')
          print('motif_gaps='+' '.join(f'{x:X}' for x in motif))
          print(f'exact_match_count={len(matches)}')
          for idx,row in matches:
              print(f'match_symbol_index={idx} symbol_rva=0x{row[0]-0x100000000:08X} root_if_minus_18=0x{row[0]-0x100000000-0x18:08X} type={row[1]} name={row[2]}')
          if len(matches)!=1:
              raise SystemExit(f'expected one exact motif match, got {len(matches)}')
          PY

      - name: Commit exact alignment report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add docs/data/rekordbox-7.2.16-merged-alignment.txt
          git commit -m 'chore(data): pin exact 7.2.16 root motif'
          git push
