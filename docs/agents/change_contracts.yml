      - docs/status/active_work_registry.md
      - docs/architecture/doc_index.md
      - docs/research/soundswitch/research_tools.md
    forbidden_assumptions:
      - passive captures validate software-visible wire evidence, not physical fixtures
      - unsupported layouts, missing cues, and unresolved render layers must fail closed
      - research helpers are not production exporter or bridge runtime modules
      - frozen snapshots and captures are verifier oracles, not the ongoing SoundSwitch authoring source
      - a complete rescan must retain added, removed, opaque, unsupported, and changing sources
      - generic research parsers default to ambiguous, but the version-locked SoundSwitch 2.10.3 runtime/export rule is wire-proven one-based for legacy autoloops, legacy scripted tracks, and a cold-open newly authored scripted track; raw zero is clear/control
      - editor-selected cue intent can differ from SoundSwitch runtime output; export/player acceptance reproduces emitted runtime frames from bytes and never silently substitutes editor intent
      - capture residuals contaminated by another deck or runtime overrides do not invalidate the decoded single-owner static source, but they also do not prove physical fixture behavior
      - synthetic render-at-elapsed tests alone do not prove transport behavior; only explicitly captured seek, pause, loop, refire, stop, and unload observations may be claimed, within their base-render scope

