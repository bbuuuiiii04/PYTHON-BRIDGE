      - python3 tools/check_agent_contracts.py
    docs_update:
      - docs/research/spectral_audio_analysis_redesign.md
      - AGENTS.md
    consumers:
      - "LIGHTING ENGINE v2 F4 texture layer (AWR-164) is a pure CONSUMER of the v4 classes (stab/sustained_bass/growl/sustained_synth/kick_prominence/bright_tilt/thick/bottom_gone/roll/lowmid_pulse); it added ZERO analysis code here (spectral_profile.py unchanged). sustained_synth is the clean-euphoric proxy (counts vocals) and must never be surfaced as 'synth'; lowmid_pulse ships computed-not-consumed."
    forbidden_assumptions:
      - analysis outputs describe sound; no output may time or trigger a cue (worst-case wrong analysis = wrong seasoning, never a missed or phantom cue)
      - v4 code must never modify or delete v3 cache entries, the Rekordbox DB, ANLZ files, or audio files
      - "hardness_v0 (AWR-203) is an OFFLINE, non-authoritative shadow descriptor with ZERO runtime importers (only tools/ + tests/ may import it; a static test enforces this). violence/.tier stay the sole live authority — hardness never routes live, replaces tier, or feeds darkness. H>=1.0 is path-threshold firing (in-sample, binary T3 only), NOT a validated boundary; there is no T1/T2 split. hardness_v0 does no I/O and tools/hardness_ablation.py is read-only (resolves only current filepath+ANLZ grid via get_cached_v4, asserts the current-key payload's realpath+beatgrid_fingerprint, never enumerates raw cache JSON, never extracts/writes)."
      - "approach_features_v0 (AWR-204) emits OFFLINE raw approach descriptors only (quantiles/trends/floors/run-lengths at +/-2 marker offsets) with ZERO runtime importers (only tools/ + tests/ may import it); it decides nothing — no class, threshold, darkness length, or live authority — and missing/short/non-finite data yields an explicit unavailable/insufficient result, never a fabricated darkness event."
      - "drop_energy_v0 (AWR-290, energy E3) grades are STATUS-ONLY at E3: no presentation/laser/LED path may read DropDecision.energy_grade (a static import-fence test allows only state_manager.py + tools/ + tests/); the field is inert data. The E1 store is reached ONLY via the E2 loader/memo (_track_weight_store_once + section_energy_v0.store_track_weight) — no second store path. True-drop law: the worker grades RAW ANLZ-marker windows as attach material only; every surfaced grade (status, logs) comes from plan-attached true-drop decisions built from meta.smart_drops — no surface enumerates the raw set. within_track = mean of three gain-invariant terms (body loudness-relative, sub-duty vs ref-12, onset-ratio vs the track's own onset_mh_p90); library_scaled = within_track x track_weight or null. RBSS_DROP_ENERGY default-OFF => byte-identical (four-surface kill test: no compute, no payload key, no status key, all DropDecision.energy_grade None); plan_track's new keyword-only drop_grades=None preserves the legacy call shape when off. All compute + the single store read run on the ANLZ worker thread, never the 200 Hz push loop. Gate thresholds (G1 0.95, G2 IQR 0.05, G3 separation 0.15) and every constant move ONLY by spec amendment; a failed gate is a valid, reported result."
      - "section_energy_v0 (AWR-288, energy E2) grades are STATUS-ONLY at E2: no LED/laser/SS module may read them (a static import-fence test allows only state_manager.py + tools/ + tests/). The E1 track-weight store is consumed ONLY through load_track_weight_store, which refuses accepted:false / missing / malformed / wrong-version stores BY CONSTRUCTION; absent data (no store / no v4 / no markers / short section / non-finite) ⇒ absent grades, never fabricated. within_track is gain-invariant (loudness_ref_db-relative, offset cancels); library_scaled = within_track × track_weight or null. RBSS_SECTION_ENERGY default-OFF ⇒ byte-identical bridge (kill test: no computation, no ANLZ_DATA payload key, no status key). All compute + the single store read run on the ANLZ worker thread, never the 200 Hz push loop. Gate thresholds (G1 0.95, G2 0.90@0.10) and every constant move ONLY by spec amendment with exec sign-off; a failed gate is a valid, reported result."
      - "track_weight_v0 (AWR-286, energy E1) is an OFFLINE library track-weight descriptor with ZERO runtime importers (only tools/ + tests/ may import it; a static test enforces this forever). It decides NOTHING live — no cue timing/trigger, no class, no threshold, no live authority; there is no live consumer at E1 (E2+ consumers arrive under their own specs). Gain-invariance is by construction: dB duties compare each track's own full_db/sub_db against its own loudness_ref_db (p95 full_db), so uniform per-track mastering offsets cancel; onset_density_midhigh + growl_flatness are count/ratio series; NO absolute-dB feature enters the aggregate. Missing/short/malformed data -> None, never a fabricated weight. tools/track_weight_report.py is read-only against the Rekordbox DB/ANLZ/audio/v3/v4 caches and writes ONLY <cache_dir>/trackweight_v1/track_weight_store.json (+ optional --out); the store is machine-local and NEVER committed. The pinned acceptance gate (by_genre Spearman |rho| <= 0.50, n >= 100, no degenerate component) and every constant move ONLY by spec amendment with exec sign-off, never by the implementer to make a run pass; a failed acceptance is a valid, reported result."
      - "spectral_ear_benchmark gold intake (AWR-205) is OFFLINE and READ-ONLY: --emit-gold-template / --gold add a per-drop gold layer + strict fail-closed loader on top of the AWR-200 harness with ZERO runtime behavior change. Gold/label fields NEVER reach a predictor — they flow only into scoring, blocked two-sided by call_planner's positive allowlist + LEAK_FORBIDDEN_FIELDS. An accuracy axis flips AVAILABLE only with >=1 genuine-drop gold example AND a real scorer against a verified per-marker DropDecision output (tier/family only this round; darkness/growl/laser/drop_classification stay UNAVAILABLE with a named blocker — fail toward UNAVAILABLE). is_partial must NOT be weakened: AWR-200 stays PARTIAL until every REQUIRED accuracy axis has gold + a scorer. The AWR-182 label file is read-only (byte-identical); template + filled gold files live under local/ (gitignored) and are never committed."
      - absent analysis data reads as no signal, never as a false event
      - the v3-compat block must stay bit-identical to the v3 extractor (the smart-drop scorer consumes it unchanged)
      - every future schema version gets its own cache subdirectory; eviction never crosses versions
      - calibration statistics and validation claims use BY GENRE playlist tracks only

