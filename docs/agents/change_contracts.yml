      - LEDLookDirector
      - LedColorEngine
      - LEDDispatchCoordinator
      - GoveeSceneAdapter
      - GoveeRuntimeSender
      - GoveeRealtimeRunner
      - GoveeRealtimeTransport
      - GoveeFrameRenderer
      - BeatSyncEngine
    inspect:
      - docs/subsystems/led_govee.md
      - docs/status/feature_status_matrix.md
      - docs/status/support_matrix.md
      - docs/status/validation_matrix.md
    tests:
      - python3 -m unittest discover tests
      - python3 tools/check_docs_metadata.py
      - python3 tools/check_agent_contracts.py
    docs_update:
      - docs/subsystems/led_govee.md
      - docs/status/feature_status_matrix.md
      - docs/status/support_matrix.md
      - docs/status/validation_matrix.md
      - docs/validation/hardware_validation_log.md
      - docs/status/active_work_registry.md
      - docs/agents/task_playbooks/change_led_govee_behavior.md
    forbidden_assumptions:
      - H612D behavior does not imply all Govee devices work
      - software tests do not prove device compatibility

