    consumers:
      - "LIGHTING ENGINE v2 F4 texture layer (AWR-164) is a pure CONSUMER of the v4 classes (stab/sustained_bass/growl/sustained_synth/kick_prominence/bright_tilt/thick/bottom_gone/roll/lowmid_pulse); it added ZERO analysis code here (spectral_profile.py unchanged). sustained_synth is the clean-euphoric proxy (counts vocals) and must never be surfaced as 'synth'; lowmid_pulse ships computed-not-consumed."
    forbidden_assumptions:
      - analysis outputs describe sound; no output may time or trigger a cue (worst-case wrong analysis = wrong seasoning, never a missed or phantom cue)
      - v4 code must never modify or delete v3 cache entries, the Rekordbox DB, ANLZ files, or audio files
      - "hardness_v0 (AWR-203) is an OFFLINE, non-authoritative shadow descriptor with ZERO runtime importers (only tools/ + tests/ may import it; a static test enforces this). violence/.tier stay the sole live authority — hardness never routes live, replaces tier, or feeds darkness. H>=1.0 is path-threshold firing (in-sample, binary T3 only), NOT a validated boundary; there is no T1/T2 split. hardness_v0 does no I/O and tools/hardness_ablation.py is read-only (resolves only current filepath+ANLZ grid via get_cached_v4, asserts the current-key payload's realpath+beatgrid_fingerprint, never enumerates raw cache JSON, never extracts/writes)."
      - "approach_features_v0 (AWR-204) emits OFFLINE raw approach descriptors only (quantiles/trends/floors/run-lengths at +/-2 marker offsets) with ZERO runtime importers (only tools/ + tests/ may import it); it decides nothing — no class, threshold, darkness length, or live authority — and missing/short/non-finite data yields an explicit unavailable/insufficient result, never a fabricated darkness event."
      - "drop_energy_v0 (AWR-290/291, energy E3) grades are STATUS-ONLY at E3: no presentation/laser/LED path may read DropDecision.energy_grade (a static import-fence test allows only state_manager.py + tools/ + tests/); the field is inert data. The E1 store is reached ONLY via the E2 loader/memo (_track_weight_store_once + section_energy_v0.store_track_weight) — no second store path; Task 6 reads drop_body_distribution off the SAME already-loaded store object (one authorized keyword-only wiring delta, corpus_drop_levels=None default). True-drop law: the worker grades RAW ANLZ-marker windows as attach material only; every surfaced grade comes from plan-attached true-drop decisions — no surface enumerates the raw set, and body_basis is recorded but never surfaced. §2 FACET PUBLICATION: every grade dict also carries the four term VALUES (body, activity, perc_high, growl) beside within_track/library_scaled/coverage/body_basis — computed per window, previously discarded, now RECORDED on the grade + in the ANLZ payload but NEVER surfaced (the per-deck status block already projects only beat/within_track/library_scaled). within_track = mean of FOUR REQUIRED terms: body = mid-rank of the window level among the track's OWN drop-window levels (body_basis='track_drops', ranked against the RAW ANLZ marker set) or the corpus drop-level distribution when the track has <2 own drops (body_basis='corpus'); activity = clip(mean fluxsum_midhigh / the track's own fluxsum_midhigh p90) (R4 swap — replaced the v1 onset count term whose cached onset_mh_p90 normaliser sat in {2,3,4} on 98.2% of tracks; onset_mh_p90 is RETIRED from the E3 required-normaliser set); perc_high = clip(mean perc_high / the track's own perc_high p90); growl = clip(mean growl_flatness / growl_timbre_p90). The post-swap required-normaliser set is the in-module fluxsum_midhigh p90 + growl_timbre_p90 + the in-module perc_high p90. ALL FOUR terms are required — if any normaliser is absent/non-finite/<=0 the drop is OMITTED, never a re-weighted mean over fewer terms. library_scaled = within_track x track_weight or null. RBSS_DROP_ENERGY default-OFF => byte-identical (four-surface kill test: no compute, no payload key, no status key, all DropDecision.energy_grade None). All compute + the single store read run on the ANLZ worker thread, never the 200 Hz push loop. The SEVEN gates (G1 coverage 0.95, G2 term-saturation 0.20, G3 term-correlation 0.60, G4 IQR 0.10, G5 rankability 0.90, G6 level-separation 3.0 dB, G7 GRADE-SPACE separation 0.10 — the one that reads the grade and makes the set non-noise-passable) and every constant move ONLY by spec amendment; a failed gate is a valid, reported result."
      - "section_energy_v0 (AWR-288/291, energy E2) grades are STATUS-ONLY at E2: no LED/laser/SS module may read them (a static import-fence test allows only state_manager.py + tools/ + tests/). The E1 track-weight store is consumed ONLY through load_track_weight_store, which refuses accepted:false / missing / malformed / wrong-version (schema_version != 2) stores BY CONSTRUCTION; a version mismatch refuses to LIBRARY-SCALE (library_scaled = null), NOT to grade — within_track takes no store input, so a refused/v1 store still yields v2 within_track grades. Absent data (no v4 / no markers / short section / non-finite) ⇒ absent grades, never fabricated. within_track = the section's MEDIAN full_db (not mean — one silent -100 dB beat no longer drags a section to zero) mapped through the loudness-relative span -12 dB -> 0.0, 0 dB -> 1.0 (re-placed from the -8/-3 tier constants, which pinned ~49% of sections at 1.000); gain-invariant (offset cancels). library_scaled = within_track x track_weight or null. §2/§3 FACET PUBLICATION: every grade dict also carries segmentation_basis in {markers, section_map} (WHICH lawful basis drew the boundaries — chosen in _normalized_segments, now RETURNED not discarded), contrast_class in {flat, normal} (flat iff the UNCLIPPED per-section rel range < 5.0 dB, reduced in the grading pass; label stays the runway authority), and slope — the §3 within-section loudness-trajectory channel: the mean POSITIVE per-beat slope (t_pos) of the smoothed full_db over a ~3 s attentional window, published RAW in dB per attentional window, NON-negative and NOT mapped to [0,1] (a [0,1] presentation is E4's job, where corpus access is lawful). The slope beat clock is derived IN-MODULE from the v4 object (60*n_beats/duration_s) so grade_sections keeps its signature and the state_manager call site stays closed; the windowed-slope math (moving_average/trailing_slope/bpm_window_beats) is a byte-copy of the C3 prototype, only the in-section window MODE is offered (the trailing MODE inverts the sign and is structurally unreachable), and an underivable clock (or a section with no finite windowed slope) yields an ABSENT slope key, never a fabricated 0.0. All three facets are RECORDED on the grade dict + in the ANLZ payload but NEVER surfaced: current_section PROJECTS the per-deck E2 status block to the frozen five-key set {start_beat, end_beat, label, within_track, library_scaled}, so the status SHAPE stays unchanged while the grade dicts grow. SLOPE IS AGGREGATE/LABEL-USE ONLY (C1 condition, carried here from the withdrawn-and-reissued C1 ruling so it lives in a committed controlling contract rather than only in a report): the published per-section slope is validated ONLY as a corpus/label-level aggregate — the measured clock disagreement moves 11.66% of individual published slope values (changed-section |delta| median 0.0186, p90 0.1059, max 0.8952 dB/window; 10 sections move from exactly 0.0 to positive), so NO production consumer may read an INDIVIDUAL section grade's slope value. Any individual-section consumer requires C1 to be REOPENED by an explicitly amended consumer spec with exec sign-off; it is not an implementation decision. ENFORCEMENT INSTRUMENT (A4 satisfiability — an obligation without an instrument is a defect): the static test SlopeConsumerFenceTests in tests/test_section_energy_v0.py fails the suite on any production LITERAL-KEY read of a grade's "slope" key, outside an explicitly EMPTY allowlist. It inspects EVERY production .py file INCLUDING the producer section_energy_v0.py, and the exemption is SITE-SPECIFIC (not context-generic): a "slope" literal is allowed ONLY when all three hold — the file IS section_energy_v0.py, the subscript is in Store context, AND it is a direct target of a plain assignment. So a grade["slope"] = ... write added to any OTHER module is REJECTED, and inside the producer a for-loop target, augmented assignment or del of the key is likewise REJECTED (each demonstrated CAN-FAIL); an unknown/unlabelled caller defaults to NOT-the-producer. tools/ + tests/ are exempt as offline/aggregate readers exactly as the import fence treats them. Coverage is defined by inversion rather than by a spelling list: every "slope" string constant is a violation unless it is that one write site, so subscript, .get, .pop, .setdefault, .__getitem__, .__contains__, itemgetter, membership/equality key checks, match-case mapping patterns, literal key collections, in-file key aliases, keyword args, f-strings, implicit concatenation, ternary keys, augmented assignment and del are all rejected. The regression corpus is 33 LITERAL-USE PROBES — 20 of them genuine individual-value reads, 13 conservative probes (writes, presence checks, reader constructions, bare literal uses) — an exact split asserted by test_probe_taxonomy_counts_are_exact, so no document need call all 33 "read forms". DISCLOSED LIMITS — the instrument does NOT claim to catch every conceivable read. There are EXACTLY FOUR blind-spot categories, documented on _slope_read_sites, each ASSERTED-BLIND by a test so the disclosure cannot go stale, and all four forbidden by this contract even though static analysis cannot see them: (1) computed/run-time keys ("sl"+"ope", f-strings with placeholders, keys arriving from data, AND source-in-a-string such as eval('g["slope"]') — folded in here, not counted separately); (2) cross-file key aliases (the defining file is still flagged); (3) **-unpacking a grade into a function whose PARAMETER is named slope; (4) whole-dict passthrough to a generic serializer (a different violation shape, guarded instead by the current_section five-key projection and the status-shape test). A green fence therefore proves no literal-key read exists, NOT that no read exists. RBSS_SECTION_ENERGY default-OFF ⇒ byte-identical bridge (kill test: no computation, no ANLZ_DATA payload key, no status key; facets + slope ride the same gated path). All compute + the single store read run on the ANLZ worker thread, never the 200 Hz push loop. Gates (G1 coverage 0.95, G2 saturation 0.20, G3 rankability 0.90, G4 chorus-vs-low separation 0.25) and every constant move ONLY by spec amendment with exec sign-off; a failed gate is a valid, reported result."
      - "track_weight_v0 (AWR-286/291, energy E1) is an OFFLINE library track-weight descriptor with ZERO runtime importers (only tools/ + tests/ may import it; a static test enforces this forever — in particular it must NOT import drop_energy_v0). It decides NOTHING live — no cue timing/trigger, no class, no threshold, no live authority; there is no live consumer at E1 (E2+ consumers arrive under their own specs). The v2 component set is body_duty, brightness_med, onset_mh_mean, growl_flatness_mean (brightness_med replaced sub_duty, which duplicated body_duty at rho +0.578). NO absolute-dB feature enters the aggregate: body_duty is loudness_ref_db-relative so a uniform offset cancels; brightness_med is a power-weighted centroid carrying no absolute dB; onset/growl are count/ratio series. Missing/short/malformed data -> None, never a fabricated weight. TWO GATING acceptance controls on the by_genre split (n >= 100) — loudness proxy |rho(loudness_ref_db, weight)| <= 0.50 and worst component-pair |rho| <= 0.60 — plus ONE PRINTED DIAGNOSTIC: the dynamic-range correlation |rho(weight, robust_dynamic_range = p95-p25 full_db)|, reported against the 0.55 reference in DRAMA_ACCEPT_MAX and GATING NOTHING since the E1SCRAMBLE demotion (AWR-291 §5 Task 4b: the compression-family secondaries showed a formulation correlating with dynamic range is most likely reading ARRANGEMENT — the thing E1 is asked to rank — so gating at 0.55 gates against real signal; the primary predeclared statistic FIRED SCRAMBLE on an EQ op, not a compressor, so the demotion rests on named secondaries, and mastering is not free either: median tax +0.044 weight, p90 ~0.11, up to 32/100 ranks under a full chain, which is why the line stays PRINTED forever). The demotion may land ONLY with its replacement watchdog (tools/energy_scramble_watchdog.py) — demote-without-replacement is out of scope by construction. COUPLING IS DISCHARGED BY WRITE-ORDER, and this is the CONTROLLING statement of that rule (carried here from local/spectral_v5_2026_07_17/EBUILD4_coupling_adjudication.md, which is the exec amendment; narrative prose elsewhere is a record, not the carry): the COMPLETE replacement artifact AND ITS TESTS must be written to the working tree BEFORE the demotion/removal edit is made, so that no auto-sync snapshot at any instant can hold the removal without its replacement. The old single-commit phrasing ("in the same change") is UNSATISFIABLE in this repo — the auto-sync hook may commit any dirty working tree at a turn boundary — and a lane handed that phrasing must flag it as unsatisfiable rather than promise it. HISTORICAL RECORD, not a precedent: the AWR-291 §5 demotion itself violated the rule — auto-sync published d1c30cf0 and 5887c503 carrying the demotion with no watchdog, which arrived 11m49s after the first of those (22:58:05 -> 23:09:54) in 51a7e639. That split was accepted by explicit exec amendment with bounded effect (an OFFLINE acceptance verdict, zero runtime readers of the changed branch, both energy flags default-off); the earlier claims that it "landed only together" or was "structurally impossible" were FALSE and are withdrawn. Every future coupling obligation in this contract is stated in the write-order form above. DOWNSTREAM DISCLOSURE, stated rather than left for a future seat: the E1 verdict is not inert — section_energy_v0.load_track_weight_store refuses any store whose accepted is not True, and a refused store means library_scaled = null everywhere in E2 and E3. Removing this branch removes the only condition under which accepted could go false on the dynamic-range control, so a FUTURE E1 formulation that would have failed it now yields an accepted store. NARROW STATEMENT OF THE EFFECT (EBUILD4REV finding 4 — the broader form was unsupported): an accepted store does NOT guarantee non-null library_scaled anywhere. It can change null to numbers ONLY on ELIGIBLE GRADED TRACKS THAT ALSO HAVE A VALID STORE ROW — a track whose cache_key is absent from store["tracks"], or whose track_weight is missing / non-finite, still yields library_scaled = None by construction in BOTH E2 and E3 (store_track_weight returns None, and each module emits None without a finite weight). NOTHING MOVES TODAY: r2 measured rho -0.486 against the 0.55 ceiling, so today's verdict is unchanged either way — which is exactly why this is a disclosure, not a gate. The rho_drama parameter STAYS in acceptance_verdict's signature, accepted-and-ignored, so no caller changes. tools/track_weight_report.py is read-only against the Rekordbox DB/ANLZ/audio/v3/v4 caches and writes ONLY <cache_dir>/trackweight_v1/track_weight_store.json (schema_version 2 with drop_body_distribution, the E3 body-term corpus fallback; + optional --out); the store is machine-local and NEVER committed. Every constant moves ONLY by spec amendment with exec sign-off, never by the implementer to make a run pass; a failed acceptance is a valid, reported result. The env flags, threads, import fences, status surfaces and flag-off byte-identity kill tests are UNCHANGED by AWR-291."
      - "spectral_ear_benchmark gold intake (AWR-205) is OFFLINE and READ-ONLY: --emit-gold-template / --gold add a per-drop gold layer + strict fail-closed loader on top of the AWR-200 harness with ZERO runtime behavior change. Gold/label fields NEVER reach a predictor — they flow only into scoring, blocked two-sided by call_planner's positive allowlist + LEAK_FORBIDDEN_FIELDS. An accuracy axis flips AVAILABLE only with >=1 genuine-drop gold example AND a real scorer against a verified per-marker DropDecision output (tier/family only this round; darkness/growl/laser/drop_classification stay UNAVAILABLE with a named blocker — fail toward UNAVAILABLE). is_partial must NOT be weakened: AWR-200 stays PARTIAL until every REQUIRED accuracy axis has gold + a scorer. The AWR-182 label file is read-only (byte-identical); template + filled gold files live under local/ (gitignored) and are never committed."
      - absent analysis data reads as no signal, never as a false event
      - the v3-compat block must stay bit-identical to the v3 extractor (the smart-drop scorer consumes it unchanged)
      - every future schema version gets its own cache subdirectory; eviction never crosses versions
      - "an entry whose audio lives on an UNMOUNTED volume is unknown, not stale: eviction must never delete USB pre-warm entries (tools/spectral_stick_sweep.py writes them keyed by the on-stick /Volumes/<name>/... path) just because the stick is unplugged. Eviction also never reads or deletes foreign files: macOS AppleDouble `._*` sidecars are skipped by both sweeps, which is what makes 'undecodable entry => stale' safe."
