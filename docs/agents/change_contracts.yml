# Machine-readable change contracts — the single subsystem map for agents.
# If code in code_globs changes, update every doc in docs_update and run the checks.
# key_symbols are verified to exist in code by tools/check_agent_contracts.py.
version: 2
last_verified_commit: 63e1319e
last_verified_date: 2026-07-24
contracts:
  core_bridge:
    code_globs:
      - __main__.py
      - state_manager.py
      - active_deck_resolver.py
      - smart_phrasing.py
      - models.py
      - config.py
    key_symbols:
      - StateManager
      - resolve_active_deck
      - ActiveDeckDecision
      - BridgeEvent
      - DeckState
    inspect:
      - docs/subsystems/core_bridge.md
      - docs/architecture/current_architecture.md
      - docs/architecture/runtime_invariants.md
    tests:
      - python3 -m unittest discover tests
      - python3 tools/check_agent_contracts.py
    docs_update:
      - docs/subsystems/core_bridge.md
      - docs/architecture/current_architecture.md
      - docs/architecture/runtime_invariants.md
    forbidden_assumptions:
      - StateManager is the only writer of DeckState; readers publish events/snapshots
      - the 200 Hz push loop must not gain blocking I/O

  runtime_commands:
    code_globs:
      - runtime_status.py
      - __main__.py
      - validation_runner.py
    key_symbols:
      - parse_command
      - StatusWriter
      - CommandReader
      - STATUS_PATH
      - COMMANDS_PATH
    inspect:
      - runtime_status.py
      - __main__.py
      - validation_runner.py
      - docs/subsystems/runtime_commands.md
      - docs/setup/runtime_commands.md
    tests:
      - python3 tools/check_docs_drift.py
      - python3 -m unittest discover tests
    docs_update:
      - docs/setup/runtime_commands.md
      - docs/subsystems/runtime_commands.md
      - docs/subsystems/logging.md
      - docs/status/feature_status_matrix.md
      - docs/status/validation_matrix.md
      - docs/validation/software_test_inventory.md
      - docs/agents/task_playbooks/change_runtime_command.md
    forbidden_assumptions:
      - accepted command does not prove callback wiring
      - callback wiring does not prove hardware-visible behavior

