      - python3 tools/check_docs_metadata.py
      - python3 tools/check_agent_contracts.py
      - python3 tools/check_docs_drift.py
      - python3 tools/check_docs_staleness.py --report
      - git diff --check
    docs_update:
      - docs/plans/active/soundswitch_exporter_remaining_work.md
      - docs/plans/active/soundswitch_README.md
      - docs/prompts/active/soundswitch_rw1_export_from_ss_design_prompt.md
      - docs/prompts/reviews/soundswitch_exporter_remaining_work_adversarial_review_prompt.md
      - docs/subsystems/soundswitch_output.md
      - docs/subsystems/core_bridge.md
      - docs/subsystems/runtime_commands.md
      - docs/subsystems/laser.md
      - docs/subsystems/config.md
      - docs/subsystems/tests.md
      - docs/architecture/current_architecture.md
      - docs/architecture/runtime_invariants.md
      - docs/architecture/laser_director_design.md
      - docs/setup/configuration.md
      - docs/setup/runtime_commands.md
      - docs/status/feature_status_matrix.md
      - docs/status/support_matrix.md
      - docs/status/validation_matrix.md
      - docs/status/known_limitations.md
      - docs/validation/software_test_inventory.md
      - docs/validation/hardware_validation_log.md
    forbidden_assumptions:
      - other SoundSwitch versions or profiles behave like SoundSwitch 2.10.3
      - a project that matches the RAVE Venue GUID is automatically the right project; the canonical project UUID must also match because a scratch corpus shares the GUID
      - passive Art-Net proves physical fixtures
      - display name, file order, or cue index is durable identity
      - absent channel-2 utility notes imply hidden SoundSwitch targets
      - a missing MIDI note-off is safe
      - Enttec process death clears its last frame

  soundswitch_research:
    code_globs:
      - tools/ssfmt/re/*.py
    inspect:
      - docs/research/soundswitch/README.md
      - docs/research/soundswitch/soundswitch_re_closure_report.md
      - docs/research/soundswitch/soundswitch_ghidra_addendum.md
      - docs/research/soundswitch/soundswitch_ssfile_format.md
      - docs/research/soundswitch/soundswitch_validation_matrix.md
      - docs/research/soundswitch/soundswitch_authoring_mutation_matrix.md
      - docs/research/soundswitch/soundswitch_importer_exporter_player_codex_spec.md
      - docs/research/soundswitch/history/README.md
      - docs/status/active_work_registry.md
      - docs/architecture/doc_index.md
      - docs/research/soundswitch/research_tools.md
    tests:
      - python3 -m py_compile tools/ssfmt/re/*.py
      - python3 -m unittest tests.test_ssfile_reference_convention
      - python3 -m unittest tests.test_inventory_project_artifacts
      - python3 -m unittest tests.test_static_looks
      - python3 -m unittest tests.test_venue_fixture_profile
      - python3 tools/check_docs_metadata.py
      - python3 tools/check_agent_contracts.py
      - python3 tools/check_docs_drift.py
      - python3 tools/check_docs_staleness.py --report
      - git diff --check
    docs_update:
      - docs/research/soundswitch/README.md
      - docs/research/soundswitch/soundswitch_re_closure_report.md
      - docs/research/soundswitch/soundswitch_ghidra_addendum.md
      - docs/research/soundswitch/soundswitch_ssfile_format.md
      - docs/research/soundswitch/soundswitch_validation_matrix.md
      - docs/research/soundswitch/soundswitch_authoring_mutation_matrix.md
      - docs/research/soundswitch/soundswitch_importer_exporter_player_codex_spec.md
      - docs/research/soundswitch/history/README.md
      - docs/status/active_work_registry.md
      - docs/architecture/doc_index.md
      - docs/research/soundswitch/research_tools.md
    forbidden_assumptions:
      - passive captures validate software-visible wire evidence, not physical fixtures
      - unsupported layouts, missing cues, and unresolved render layers must fail closed
      - research helpers are not production exporter or bridge runtime modules
      - frozen snapshots and captures are verifier oracles, not the ongoing SoundSwitch authoring source
      - a complete rescan must retain added, removed, opaque, unsupported, and changing sources
      - generic research parsers default to ambiguous, but the version-locked SoundSwitch 2.10.3 runtime/export rule is wire-proven one-based for legacy autoloops, legacy scripted tracks, and a cold-open newly authored scripted track; raw zero is clear/control
      - editor-selected cue intent can differ from SoundSwitch runtime output; export/player acceptance reproduces emitted runtime frames from bytes and never silently substitutes editor intent
      - capture residuals contaminated by another deck or runtime overrides do not invalidate the decoded single-owner static source, but they also do not prove physical fixture behavior
      - synthetic render-at-elapsed tests alone do not prove transport behavior; only explicitly captured seek, pause, loop, refire, stop, and unload observations may be claimed, within their base-render scope

