    docs_update:
      - docs/research/spectral_audio_analysis_redesign.md
      - AGENTS.md
    consumers:
      - "LIGHTING ENGINE v2 F4 texture layer (AWR-164) is a pure CONSUMER of the v4 classes (stab/sustained_bass/growl/sustained_synth/kick_prominence/bright_tilt/thick/bottom_gone/roll/lowmid_pulse); it added ZERO analysis code here (spectral_profile.py unchanged). sustained_synth is the clean-euphoric proxy (counts vocals) and must never be surfaced as 'synth'; lowmid_pulse ships computed-not-consumed."
    forbidden_assumptions:
      - analysis outputs describe sound; no output may time or trigger a cue (worst-case wrong analysis = wrong seasoning, never a missed or phantom cue)
      - v4 code must never modify or delete v3 cache entries, the Rekordbox DB, ANLZ files, or audio files
      - absent analysis data reads as no signal, never as a false event
      - the v3-compat block must stay bit-identical to the v3 extractor (the smart-drop scorer consumes it unchanged)
      - every future schema version gets its own cache subdirectory; eviction never crosses versions
      - calibration statistics and validation claims use BY GENRE playlist tracks only

