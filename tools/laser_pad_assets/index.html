<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laser Pad</title>
    <script src="/static/pad-state.js?v=ux-5"></script>
    <script src="/static/pad-selectors.js?v=ux-5"></script>
    <script src="/static/pad-actions.js?v=ux-5"></script>
    <script src="/static/pad-ui.js?v=ux-5"></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" integrity="sha384-l8f0VcPi/M1iHPv8egOnY/15TDwqgbOR1anMIJWvU6nLRgZVLTLSaNqi/TOoT5Fh" crossorigin="anonymous" defer></script>
    <link rel="stylesheet" href="/static/pad.css?v=ux-5" />
  </head>
  <body x-data="laserPadApp()" x-init="init()">
    <div class="app panel" x-cloak>
      <header class="laser-header">
        <div class="header-title-row">
          <div class="title-chip">▓▓ LASER PAD ▓▓</div>
          <div class="runtime-pill" :class="runtimeStatusClass()">
            <span>Live</span>
            <strong x-text="runtime.active_personality || '-'"></strong>
            <span x-text="runtime.current_scene || 'offline'"></span>
            <span class="runtime-reason" x-text="runtime.last_reason || '-'"></span>
          </div>
          <div class="status-line" x-text="statusText || 'ready'"></div>
        </div>

        <div class="control-strip">
          <label class="field-inline wide-field" title="MIDI output port">Output
            <select x-model="selectedPort" @change="setMidiPort()">
              <template x-if="!availablePorts().length">
                <option value="" disabled>No MIDI outputs found</option>
              </template>
              <template x-for="port in availablePorts()" :key="port">
                <option :value="port" x-text="port + (midiPorts.includes(port) ? '' : ' (offline)')"></option>
              </template>
            </select>
          </label>
          <details class="header-port-fallback" :open="manualPortOpen" @toggle="manualPortOpen = $event.target.open">
            <summary>Type port name…</summary>
            <div class="port-fallback">
              <input
                type="text"
                placeholder="Type port name (e.g. IAC Driver Bus 1)"
                x-model="manualPort"
                @keydown.enter.prevent="applyManualPort()"
              />
              <button @click="applyManualPort()" :disabled="!manualPort.trim()">Use</button>
              <button type="button" class="subtle" @click="refreshMidiPorts()">Reload outputs</button>
            </div>
          </details>

          <label class="field-inline personality-field">Personality
            <select :value="activePersonality()" @change="setActivePersonality($event.target.value)">
              <template x-if="!personalityNames().length">
                <option value="" disabled>No personalities loaded</option>
              </template>
              <template x-for="name in personalityNames()" :key="name">
                <option :value="name" x-text="name"></option>
              </template>
            </select>
          </label>
          <div class="icon-trio" aria-label="Personality actions">
            <button type="button" title="New personality" @click="createPersonalityPrompt()">+</button>
            <button type="button" title="Rename personality" @click="renamePersonalityPrompt(activePersonality())">✎</button>
            <button type="button" title="Personality settings" @click="openSettingsTab('personalities')">ⓘ</button>
          </div>

          <label class="inline-check">
            <input type="checkbox" :checked="!!config?.enabled" @change="setEnabled($event.target.checked)" />
            <span>Lasers enabled</span>
          </label>
          <label class="inline-check" title="Practice mode — pads light up in the UI but don't send real MIDI.">
            <input type="checkbox" x-model="draftDryRun" @change="setDryRun()" />
            <span>Test mode</span>
          </label>
          <label class="field-inline mini-field" title="Beats per minute used for test timing.">Test BPM
            <input type="number" min="1" max="300" x-model.number="test.bpm" @change="persistTestUi()" />
          </label>
          <div class="commit-cluster">
            <span class="save-badge" :class="saveBadgeClass()" x-text="saveBadgeText()" :title="saveState.kind === 'error' ? saveState.lastError : ''" aria-live="polite" aria-atomic="true"></span>
            <button class="primary-action" :class="{'has-changes': hasUnsavedChanges()}" :aria-label="hasUnsavedChanges() ? 'Save & Apply, unsaved changes' : 'Save & Apply'" title="Writes your unsaved changes to disk and tells the running bridge to reload." @click="commitDraft()">💾 Save &amp; Apply</button>
          </div>
          <button class="icon-action" title="Check config" @click="validateDraftOnly()">✓</button>
          <button class="icon-action" title="Run live test" @click="verifyDraft()">▶</button>
          <button class="settings-trigger" @click="openSettingsPanel()" title="Settings" aria-label="Settings">⚙</button>
        </div>

        <template x-if="headerBanner()">
          <button class="header-banner" :class="headerBanner().kind" @click="openDiagnosticsPanel()" x-text="headerBanner().text"></button>
        </template>
      </header>
      <template x-if="lastReassignUndo.visible">
        <div class="undo-bar" role="status" aria-live="polite">
          <span x-text="lastReassignUndo.message"></span>
          <button @click="undoLastReassign()">Undo</button>
        </div>
      </template>

      <div class="result-panels">
        <section class="result-panel">
          <button class="panel-toggle" @click="showVerifyPanel = !showVerifyPanel">
            <span>System checks</span>
            <span x-text="showVerifyPanel ? 'Hide' : 'Show'"></span>
          </button>
          <div class="panel-content" x-show="showVerifyPanel">
            <template x-if="!validateResults.errors.length && !validateResults.warnings.length && !verifyResults.checks.length">
              <div class="panel-empty">No checks run yet.</div>
            </template>
            <template x-if="validateResults.errors.length || validateResults.warnings.length">
              <div>
                <strong style="font-size:0.78rem; color: var(--muted);">Config issues</strong>
                <template x-if="validateResults.errors.length">
                  <ul class="result-list error" style="margin-top: 6px;">
                    <template x-for="err in validateResults.errors" :key="err">
                      <li x-text="err"></li>
                    </template>
                  </ul>
                </template>
                <template x-if="validateResults.warnings.length">
                  <ul class="result-list warn" style="margin-top: 6px;">
                    <template x-for="warn in validateResults.warnings" :key="warn">
                      <li x-text="warn"></li>
                    </template>
                  </ul>
                </template>
              </div>
            </template>
            <template x-if="verifyResults.checks.length">
              <div style="margin-top: 10px;">
                <strong style="font-size:0.78rem; color: var(--muted);">Live test results</strong>
                <ul class="result-list verify" style="margin-top: 6px;">
                  <template x-for="row in verifyResults.checks" :key="`${row.name}-${row.detail}`">
                    <li :class="row.ok ? 'ok' : 'bad'">
                      <strong x-text="row.name"></strong>
                      <span x-text="row.ok ? 'ok' : 'failed'"></span>
                      <div x-text="row.detail"></div>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </section>
      </div>

      <section class="pad-area">
        <div class="pad-editor-toolbar">
          <label class="field-inline personality-field">Editing
            <select :value="activePersonality()" @change="setActivePersonality($event.target.value)">
              <template x-if="!personalityNames().length">
                <option value="" disabled>No personalities loaded</option>
              </template>
              <template x-for="name in personalityNames()" :key="'pad-editor-' + name">
                <option :value="name" x-text="name"></option>
              </template>
            </select>
          </label>
          <span class="pad-toolbar-hint" title="Hold ⌘ (or Ctrl on Windows/Linux) and left-click a pad to add or remove its scene from the personality you're editing.">
            <kbd>⌘</kbd>+click pad to toggle membership
          </span>
        </div>

        <div class="bank-tabs">
          <template x-for="bank in banks()" :key="bank.id">
            <button
              class="bank-tab"
              :class="{'active': bank.id === activeBankId}"
              @click="activeBankId = bank.id"
              @contextmenu.prevent="editBankPrompt(bank.id)"
              @touchstart.passive="startBankLongPress(bank.id)"
              @touchend="cancelBankLongPress()"
              @touchcancel="cancelBankLongPress()"
            >
              <span x-text="bank.name"></span>
              <span class="tab-dot">·</span>
              <span class="channel-pill" x-text="`Ch${bank.channel || 1}`"></span>
            </button>
          </template>
          <button class="bank-tab add-bank" @click="addBankPrompt()" title="Add bank">+</button>
        </div>

        <div class="note-grid">
          <template x-for="note in currentNotes()" :key="note">
            <button
              class="note-btn"
              :class="[roleClass(note), {
                'mapped': isMapped(note),
                'in-active-personality': padInActivePersonality(note),
                'pad-dim': isMapped(note) && !padInActivePersonality(note) && !sceneMetaByNote(note).system,
                'drop-target': isDropTarget(note),
                'firing': isFiring(note),
                'pressing': isPressing(note),
                'verify-fail': verifyState(note)?.ok === false,
              }]"
              :title="noteTitle(note)"
              :draggable="isMapped(note) && !sceneMetaByNote(note).system"
              @mouseup="handleNoteMouseUp(note, $event)"
              @keydown.enter.prevent="handleNoteKeyboardFire(note)"
              @keydown.space.prevent="handleNoteKeyboardFire(note)"
              @contextmenu.prevent="openDrawerPlaceholder(note)"
              @touchstart.passive="startTouchLongPress(note)"
              @touchend="endTouchLongPress(note)"
              @touchcancel="cancelTouchLongPress()"
              @dragstart="dragStart(note, $event)"
              @dragenter="dragEnter(note, $event)"
              @dragover="dragOver(note, $event)"
              @dragleave="dragLeave(note)"
              @drop="dropOn(note, $event)"
              @dragend="dragEnd()"
            >
              <span class="note-num" x-text="note"></span>
              <div class="pad-personality-chips" x-show="isMapped(note) && !sceneMetaByNote(note).system">
                <template x-for="chip in personalityChipsForNote(note)" :key="chip.name">
                  <span class="pad-personality-chip" :class="{'active': chip.isActive}" :style="`--pc-color: ${chip.color}`" :title="chip.name" x-text="chip.initial"></span>
                </template>
              </div>
              <span class="safety-dot" :class="safetyDotClass(note)"></span>
              <span class="note-label" x-text="displayLabel(note)"></span>
              <span class="note-behavior" x-text="tileBehaviorText(note)"></span>
              <div class="role-chip" x-show="isMapped(note)" x-text="roleText(note)"></div>
            </button>
          </template>
        </div>
      </section>

      <template x-if="openNote !== null">
        <div class="drawer-backdrop" @click.self="closeDrawer()">
          <div class="drawer panel mapping-drawer">
            <header class="drawer-head">
              <h3>Pad <span x-text="openNote"></span> · <span x-text="midiNoteName(openNote)"></span></h3>
              <button class="settings-close" @click="closeDrawer()" aria-label="Close pad editor">×</button>
            </header>
            <template x-if="drawer.system">
              <div class="badge-bar warn system-cta">
                <span>Managed under Settings → Blackout signal.</span>
                <button @click="openSettingsTab('blackout'); closeDrawer()">Open blackout settings</button>
              </div>
            </template>

            <div class="drawer-top-grid">
              <label>Display name:
                <input type="text" x-model="drawer.label" :disabled="drawer.system" @input="queueDraftSave()" />
              </label>
              <label>Move to bank:
                <select :disabled="drawer.system" @change="if ($event.target.value) moveOpenNoteToBank($event.target.value); $event.target.value = ''">
                  <option value="">Select bank…</option>
                  <template x-for="bank in banks().filter((bank) => bank.id !== activeBankId)" :key="bank.id">
                    <option :value="bank.id" x-text="`${bank.name} · Ch${bank.channel || 1}`"></option>
                  </template>
                </select>
              </label>
            </div>

            <section class="drawer-card primary-card">
              <h4>PRIMARY MAPPING</h4>
              <div class="drawer-personality-info">
                <strong>Editing for personality:</strong>
                <span class="drawer-personality-name" x-text="activePersonality()"></span>
                <span class="settings-field-help">Change in the toolbar above to retarget edits.</span>
              </div>
              <div class="drawer-grid">
                <label>Role:
                  <select x-model="drawer.role" :disabled="drawer.system" @change="queueDraftSave()">
                    <option value="groove">Groove</option>
                    <option value="buildup">Buildup</option>
                    <option value="drop">Drop</option>
                    <option value="post_drop">After drop</option>
                    <option value="breakdown">Breakdown</option>
                  </select>
                </label>
                <label>Trigger style:
                  <select x-model="drawer.behavior" :disabled="drawer.system" @change="drawer.behaviorTouched = true; queueDraftSave()">
                    <option value="pulse">Tap</option>
                    <option value="hold_beats">Hold for beats</option>
                  </select>
                </label>
                <label>Trigger length (ms):
                  <input type="number" min="10" max="250" x-model.number="drawer.duration_ms" :disabled="drawer.system" @input="queueDraftSave()" />
                </label>
                <label>Intensity:
                  <input type="number" min="0" max="127" x-model.number="drawer.velocity" :disabled="drawer.system" @input="queueDraftSave()" />
                  <span class="field-error" x-show="fieldError('velocity')" x-text="fieldError('velocity')"></span>
                </label>
                <label title="Minimum beats before this pad can fire again.">Cooldown beats:
                  <input type="number" step="0.25" min="0" x-model.number="drawer.cooldown_beats" :disabled="drawer.system" @input="queueDraftSave()" />
                  <span class="field-error" x-show="fieldError('cooldown_beats')" x-text="fieldError('cooldown_beats')"></span>
                </label>
                <label class="inline-check drawer-check">
                  <input type="checkbox" x-model="drawer.immediate" :disabled="drawer.system" @change="queueDraftSave()" />
                  <span>Fire instantly</span>
                </label>
                <label>Motion level:
                  <select x-model="drawer.safety_class" :disabled="drawer.system" @change="queueDraftSave()">
                    <option value="safe">Static</option>
                    <option value="movement_low">Gentle motion</option>
                    <option value="movement_medium">Moderate motion</option>
                    <option value="movement_high">Heavy motion</option>
                    <option value="high_impact">Intense</option>
                    <option value="strobe">Strobe</option>
                    <option value="blackout">Blackout</option>
                  </select>
                </label>
                <label title="Falls back to this scene if the main one fails to load or is invalid.">Backup scene:
                  <select :disabled="drawer.system" :value="currentSceneConfig()?.fallback_scene || 'safe_static'" @change="queueScenePatch(drawerSceneDetails().sceneName, { fallback_scene: $event.target.value })">
                    <template x-for="name in availableScenes()" :key="name">
                      <option :value="name" x-text="name"></option>
                    </template>
                  </select>
                </label>
              </div>
              <div class="drawer-actions">
                <button @click="sendTest(currentBank()?.channel || 1, openNote)" :disabled="drawer.system">Send test</button>
                <button
                  @click="setDrawerPrimary()"
                  :disabled="drawer.system || !drawerIsMapped() || drawerRoleChanged()"
                  :title="drawerRoleChanged() ? 'Apply song stage change first' : ''"
                >Set as primary</button>
                <button @click="removeDrawerMapping()" :disabled="drawer.system || !drawerIsMapped()">Remove mapping</button>
              </div>
            </section>

            <section class="drawer-card bank-pool" x-show="!drawer.system && drawer.role">
              <h4>BANK ROTATION POOL (<span x-text="roleBankScenes(drawer.role).length"></span> scenes)</h4>
              <template x-if="!roleBankScenes(drawer.role).length">
                <div class="panel-empty">No scenes in this role bank yet.</div>
              </template>
              <template x-for="sceneName in roleBankScenes(drawer.role)" :key="sceneName">
                <div class="pool-row">
                  <span class="pool-dot">•</span>
                  <code x-text="sceneName"></code>
                  <span x-text="`pad ${sceneMidi(sceneName).note ?? '-'}`"></span>
                  <span x-text="sceneBehaviorText(sceneName)"></span>
                  <span class="pool-primary-slot">
                    <template x-if="sceneName === primarySceneForRole(drawer.role)">
                      <span class="primary-star">⭐ primary</span>
                    </template>
                    <template x-if="sceneName !== primarySceneForRole(drawer.role)">
                      <button @click="makeScenePrimary(drawer.role, sceneName)">make primary</button>
                    </template>
                  </span>
                  <button class="danger" @click="removeSceneFromBank(drawer.role, sceneName)">×</button>
                </div>
              </template>
              <button class="link-button" @click="addSceneToCurrentBankPrompt()">+ add another scene to this bank</button>
            </section>

            <details class="advanced-drawer">
              <summary>Advanced (CC, hold beats, raw JSON)</summary>
              <div class="drawer-grid">
                <label>CC number:
                  <input type="number" disabled placeholder="not implemented" />
                </label>
                <label>CC value:
                  <input type="number" disabled placeholder="not implemented" />
                </label>
                <label>Hold (beats):
                  <input type="number" step="0.25" min="0.25" max="128" x-model.number="drawer.hold_beats" :disabled="drawer.system" @input="queueDraftSave()" />
                  <span class="field-error" x-show="fieldError('hold_beats')" x-text="fieldError('hold_beats')"></span>
                </label>
              </div>
              <template x-if="personalitiesUsingScene(drawerSceneDetails().sceneName).length">
                <div class="scene-usage-list">
                  <strong>Used by</strong>
                  <span class="settings-field-help">
                    Role labels: groove=phrase_scene, buildup=buildup_scene, drop=drop_scene, post_drop=post_drop_scene, breakdown=breakdown_scene.
                  </span>
                  <template x-for="ref in personalitiesUsingScene(drawerSceneDetails().sceneName)" :key="ref">
                    <span x-text="ref"></span>
                  </template>
                </div>
              </template>
              <pre class="raw-json" x-text="rawSceneJson(openNote)"></pre>
            </details>
          </div>
        </div>
      </template>

      <template x-if="historyOpen">
        <div class="drawer-backdrop" @click.self="closeHistoryPanel()">
          <div class="drawer panel history-drawer">
            <h3>Backup history</h3>
            <div class="history-layout">
              <div class="history-list">
                <button @click="loadHistory()">Reload</button>
                <template x-if="historyLoading">
                  <div class="panel-empty">Loading history…</div>
                </template>
                <template x-if="!historyLoading && !historyItems.length">
                  <div class="panel-empty">No backups found.</div>
                </template>
                <template x-for="item in historyItems" :key="item.name">
                  <button
                    class="history-item"
                    :class="{'active': historySelected && historySelected.name === item.name}"
                    @click="selectHistoryItem(item.name)"
                  >
                    <div class="name" x-text="item.name"></div>
                    <div class="meta">
                      <span x-text="formatHistoryTime(item.mtime)"></span>
                      <span x-text="formatHistorySize(item.size)"></span>
                    </div>
                  </button>
                </template>
              </div>
              <div class="history-diff">
                <div class="history-actions">
                  <button @click="restoreSelectedHistory()" :disabled="!historySelected">Restore selected</button>
                  <button @click="closeHistoryPanel()">Close</button>
                </div>
                <pre x-text="historyDiff || 'Pick a backup to see what changed.'"></pre>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template x-if="settingsOpen">
        <div class="settings-backdrop" @click.self="closeSettingsPanel()" @keydown.escape.window="closeSettingsPanel()">
          <aside class="settings-panel panel" role="dialog" aria-label="Settings">
            <header class="settings-header">
              <h3>Settings</h3>
              <button class="settings-close" @click="closeSettingsPanel()" aria-label="Close settings">×</button>
            </header>

            <nav class="settings-tabs">
              <template x-for="tab in settingsTabs" :key="tab.id">
                <button
                  class="settings-tab"
                  :class="{'active': settingsActiveTab === tab.id}"
                  @click="settingsActiveTab = tab.id"
                  x-text="tab.label"
                ></button>
              </template>
            </nav>

            <div class="settings-body">
              <section class="settings-section" x-show="settingsActiveTab === 'global'">
                <h4>Drop transition style</h4>
                <div class="settings-field">
                  <label>Style</label>
                  <select :value="config?.smart_drop_mode || 'blackout_mask'" @change="setSmartDropMode($event.target.value)">
                    <option value="blackout_mask">Cover with blackout</option>
                    <option value="legacy_rearm">Classic re-arm</option>
                  </select>
                  <span class="settings-field-help" title="Smooths drops by briefly blacking out lasers between scenes.">
                    Cover with blackout: smooths the drop by sending a blackout signal. Classic re-arm: original behavior.
                  </span>
                </div>

                <h4 style="margin-top: 20px;">Manual MIDI Test</h4>
                <div class="settings-field">
                  <div class="quick-test-grid">
                    <label>Channel
                      <input type="number" min="1" max="16" x-model.number="test.channel" @change="persistTestUi()" />
                    </label>
                    <label>MIDI note
                      <input type="number" min="0" max="127" x-model.number="test.note" @change="persistTestUi()" />
                    </label>
                    <label>Intensity (0–127)
                      <input type="number" min="0" max="127" x-model.number="test.velocity" @change="persistTestUi()" />
                    </label>
                    <label>Hold (beats)
                      <input type="number" min="0.25" max="128" step="0.25" x-model.number="test.hold_beats" @change="persistTestUi()" />
                    </label>
                  </div>
                  <div class="drawer-actions">
                    <button @click="fireQuickTest()">Send test</button>
                  </div>
                </div>

                <h4 style="margin-top: 20px;">Automatic scenes</h4>
                <span class="settings-field-help" style="display:block; margin-bottom: 10px;">
                  Choose which scene the laser bridge fires when something specific happens. Leave blank to use the default backup.
                </span>

                <template x-for="field in ['startup_scene','stop_scene','stale_scene','emergency_scene','fallback_scene']" :key="field">
                  <div class="settings-field">
                    <label x-text="lifecycleSceneLabel(field)"></label>
                    <select :value="config?.[field] || ''" @change="setLifecycleScene(field, $event.target.value)">
                      <option value="">(none)</option>
                      <template x-for="name in availableScenes()" :key="name">
                        <option :value="name" x-text="name"></option>
                      </template>
                    </select>
                  </div>
                </template>
              </section>

              <section class="settings-section" x-show="settingsActiveTab === 'personalities'">
                <div class="settings-personalities-head">
                  <h4>Personalities</h4>
                  <button @click="createPersonalityPrompt()">+ New</button>
                </div>
                <span class="settings-field-help" style="display:block; margin-bottom: 12px;">
                  Add, rename, duplicate, or remove personalities. Renaming the default updates everything that uses it.
                </span>

                <div class="resolver-test-panel">
                  <h4>Resolver test</h4>
                  <div class="settings-row">
                    <label class="settings-field">Playlist name
                      <input type="text" x-model="resolverTest.playlist" placeholder="Dubstep Heaters" @keydown.enter.prevent="resolvePlaylistTest()" />
                    </label>
                    <label class="settings-field">File BPM
                      <input type="number" min="0" step="0.01" x-model="resolverTest.bpm" placeholder="optional" @keydown.enter.prevent="resolvePlaylistTest()" />
                    </label>
                  </div>
                  <div class="drawer-actions">
                    <button @click="resolvePlaylistTest()" :disabled="resolverTest.loading">Test resolver</button>
                    <span class="resolver-test-result" x-show="resolverTest.result" x-text="resolverTestLabel()"></span>
                    <span class="field-error" x-show="resolverTest.error" x-text="resolverTest.error"></span>
                  </div>
                </div>

                <template x-for="name in personalityNames()" :key="name">
                  <div class="settings-personality-row">
                    <div class="settings-personality-meta">
                      <strong x-text="name"></strong>
                      <span class="settings-personality-default"
                        x-show="config?.default_personality === name">default</span>
                      <span class="settings-personality-aliases" x-text="aliasSummary(name)"></span>
                    </div>
                    <div class="settings-personality-chip-controls" :title="`Pad chip for ${name}`">
                      <span
                        class="settings-personality-chip-preview"
                        :class="{'active': activePersonality() === name}"
                        :style="`--pc-color: ${personalityColor(name)}`"
                        x-text="personalityInitials(name)"
                      ></span>
                      <input
                        type="text"
                        class="settings-personality-initial-input"
                        :value="personalityInitials(name)"
                        maxlength="3"
                        :placeholder="name.slice(0,2).toUpperCase()"
                        aria-label="Chip initials"
                        @change="setPersonalityInitial(name, $event.target.value)"
                      />
                      <input
                        type="color"
                        class="settings-personality-color-picker"
                        :value="personalityColor(name)"
                        aria-label="Chip color"
                        @change="setPersonalityColor(name, $event.target.value)"
                      />
                      <button
                        type="button"
                        class="settings-personality-chip-reset"
                        title="Reset chip to auto-assigned color/initials"
                        @click="resetPersonalityChip(name)"
                      >↺</button>
                    </div>
                    <div class="settings-personality-actions">
                      <button @click="setActivePersonality(name)">Edit</button>
                      <button @click="renamePersonalityPrompt(name)">Rename</button>
                      <button @click="duplicatePersonalityPrompt(name)">Duplicate</button>
                      <button @click="setDefaultPersonality(name)" :disabled="config?.default_personality === name">Make default</button>
                      <button
                        class="danger"
                        @click="deletePersonalityConfirm(name)"
                        :disabled="personalityNames().length <= 1"
                      >Delete</button>
                    </div>
                  </div>
                </template>

                <div class="settings-personality-editor">
                  <div class="settings-personalities-head">
                    <div>
                      <h4 x-text="displayPersonalityName(activePersonality())"></h4>
                      <span class="settings-personality-summary" x-text="personalityMatchSummary()"></span>
                    </div>
                    <span class="settings-personality-default"
                      x-show="config?.default_personality === activePersonality()">default</span>
                  </div>

                  <div class="personality-editor-section">
                    <h5>Aliases</h5>
                    <div class="settings-field">
                      <label>PER GENRE aliases</label>
                      <textarea rows="4" x-model="aliasesDraft.text" placeholder="house&#10;deep house"></textarea>
                      <span class="settings-field-help">Separate aliases with commas or new lines. Matching is case-insensitive and collapses extra spaces.</span>
                    </div>
                    <div class="drawer-actions">
                      <button @click="saveAliasesDraft()" :disabled="!canSaveAliasesDraft()">Apply aliases</button>
                    </div>
                  </div>

                  <div class="personality-editor-section">
                    <h5>BPM band</h5>
                    <div class="drawer-grid">
                      <label>BPM band min
                        <input type="number" min="0" step="0.01" x-model.number="bpmBandDraft.min" />
                      </label>
                      <label>BPM band max
                        <input type="number" min="0" step="0.01" x-model.number="bpmBandDraft.max" />
                      </label>
                    </div>
                    <div class="drawer-actions">
                      <button @click="saveBpmBandDraft()" :disabled="!canSaveBpmBandDraft()">Apply BPM band</button>
                    </div>
                  </div>

                  <div class="personality-editor-section">
                    <h5>Timing</h5>
                    <div class="drawer-grid">
                      <label title="Beats per phrase before scene rotation.">Phrase length (beats)
                        <input type="number" min="1" x-model.number="timingDraft.phrase_interval_beats" />
                      </label>
                      <label>Shortest scene (beats)
                        <input type="number" min="0" x-model.number="timingDraft.minimum_scene_hold_beats" />
                      </label>
                      <label>Buildup head-start (beats)
                        <input type="number" min="1" x-model.number="timingDraft.buildup_lookahead_beats" />
                      </label>
                      <label>Pre-drop blackout (beats)
                        <input type="number" min="0" x-model.number="timingDraft.pre_drop_blackout_beats" />
                      </label>
                      <label>After-drop hold (beats)
                        <input type="number" min="0" x-model.number="timingDraft.post_drop_hold_beats" />
                      </label>
                      <label>Breakdown restore (beats)
                        <input type="number" min="0" x-model.number="timingDraft.breakdown_default_restore_beats" />
                      </label>
                    </div>
                    <div class="drawer-actions">
                      <button @click="saveTimingDraft()" :disabled="!canSaveTimingDraft()">Apply timing</button>
                    </div>
                  </div>

                  <div class="personality-editor-section">
                    <h5>Banks</h5>
                    <template x-for="role in bankRoleDefinitions()" :key="role.key">
                      <div class="personality-bank-role">
                        <div class="personality-bank-role-head">
                          <strong x-text="role.label"></strong>
                          <span class="field-error" x-show="bankWarningForRole(role.key)" x-text="bankWarningForRole(role.key)"></span>
                        </div>
                        <label class="settings-field">Primary scene
                          <select :value="personalityPrimaryScene(role.key)" @change="savePersonalityPrimaryScene(role.key, $event.target.value)">
                            <option value="">(none)</option>
                            <template x-for="name in sceneOptionsForRole(role.key)" :key="role.key + '-primary-' + name">
                              <option :value="name" x-text="`${name} #${sceneNote(name)}`"></option>
                            </template>
                          </select>
                        </label>
                      </div>
                    </template>
                  </div>
                </div>
              </section>

              <section class="settings-section" x-show="settingsActiveTab === 'blackout'">
                <h4>Blackout signal</h4>
                <span class="settings-field-help" style="display:block; margin-bottom: 12px;">
                  Used when "Cover with blackout" is selected for the drop transition.
                  Both signals must be set.
                </span>

                <template x-for="slot in [{key:'on', label:'Turn blackout on'}, {key:'off', label:'Turn blackout off'}]" :key="slot.key">
                  <div class="settings-blackout-card">
                    <div class="settings-blackout-head">
                      <strong x-text="slot.label"></strong>
                      <span class="settings-blackout-status" x-text="blackoutConfigured(slot.key) ? 'configured' : 'not set'"></span>
                    </div>
                    <div class="settings-row">
                      <div class="settings-field">
                        <label>Channel (1–16)</label>
                        <input type="number" min="1" max="16" x-model.number="blackoutForm[slot.key].channel" />
                      </div>
                      <div class="settings-field">
                        <label>MIDI note (0–127)</label>
                        <input type="number" min="0" max="127" x-model.number="blackoutForm[slot.key].note" />
                      </div>
                    </div>
                    <div class="settings-row">
                      <div class="settings-field">
                        <label>Intensity (0–127)</label>
                        <input type="number" min="0" max="127" x-model.number="blackoutForm[slot.key].velocity" />
                      </div>
                      <div class="settings-field">
                        <label>Trigger length (ms)</label>
                        <input type="number" min="10" max="2000" x-model.number="blackoutForm[slot.key].duration_ms" />
                      </div>
                    </div>
                    <div class="drawer-actions">
                      <button @click="saveBlackout(slot.key)">Save</button>
                      <button @click="clearBlackout(slot.key)" :disabled="!blackoutConfigured(slot.key)">Remove</button>
                    </div>
                  </div>
                </template>
              </section>

              <section class="settings-section" x-show="settingsActiveTab === 'banks'">
                <h4>Banks</h4>
                <span class="settings-field-help" style="display:block; margin-bottom: 12px;">
                  Rename banks or change their MIDI channel. Pad ranges are fixed by the default layout — use Reset to restore 4 × 32.
                </span>
                <template x-for="(bank, idx) in banks()" :key="bank.id || idx">
                  <div class="settings-bank-row">
                    <div class="settings-bank-meta">
                      <span class="settings-bank-id" x-text="bank.id || `bank_${idx + 1}`"></span>
                      <span class="settings-bank-range"
                        x-text="`pads ${bank.notes?.[0] ?? '?'}–${bank.notes?.[bank.notes?.length - 1] ?? '?'} (${bank.notes?.length ?? 0})`"></span>
                    </div>
                    <div class="settings-row">
                      <label class="settings-field">
                        <span>Name</span>
                        <input type="text" :value="bank.name" @change="saveBank(idx, 'name', $event.target.value)" />
                      </label>
                      <label class="settings-field" title="Which of the 16 MIDI channels a bank sends on.">
                        <span>MIDI channel</span>
                        <input type="number" min="1" max="16" :value="bank.channel || 1" @change="saveBank(idx, 'channel', $event.target.value)" />
                      </label>
                    </div>
                  </div>
                </template>
                <div class="drawer-actions" style="margin-top: 12px;">
                  <button @click="resetBanksToDefault()">Reset to default (4 × 32)</button>
                </div>
              </section>
            </div>
          </aside>
        </div>
      </template>

      <template x-if="overwriteDialog.open">
        <div class="modal-backdrop" @click.self="cancelOverwrite()" @keydown.escape.window="cancelOverwrite()">
          <div class="modal panel">
            <h3>Replace this pad assignment?</h3>
            <p>
              Pad <strong x-text="overwriteDialog.targetNote"></strong> already has an assignment.
              Replace it with the one you're dragging?
            </p>
            <div class="drawer-actions">
              <button @click="confirmOverwrite()">Replace</button>
              <button @click="cancelOverwrite()">Cancel</button>
            </div>
          </div>
        </div>
      </template>

      <template x-if="modal.open">
        <div class="modal-backdrop" @click.self="closeModal(null)" @keydown.escape.window="closeModal(null)">
          <div
            class="modal panel"
            role="dialog"
            aria-modal="true"
            tabindex="-1"
            :aria-label="modal.title || 'Dialog'"
            x-init="$nextTick(() => $el.querySelector('input, button.primary, button.danger')?.focus())"
            @keydown.tab="
              const focusables = $el.querySelectorAll('input, button, [tabindex]:not([tabindex=\'-1\'])');
              if (!focusables.length) return;
              const first = focusables[0];
              const last = focusables[focusables.length - 1];
              if ($event.shiftKey && document.activeElement === first) { $event.preventDefault(); last.focus(); }
              else if (!$event.shiftKey && document.activeElement === last) { $event.preventDefault(); first.focus(); }
            "
          >
            <h3 x-text="modal.title"></h3>
            <p x-show="modal.message" x-text="modal.message"></p>

            <template x-if="modal.type === 'prompt'">
              <form class="modal-fields" @submit.prevent="submitModalPrompt()">
                <template x-for="field in modal.fields" :key="field.name">
                  <label>
                    <span x-text="field.label"></span>
                    <input
                      :type="field.type || 'text'"
                      x-model="field.value"
                      :placeholder="field.placeholder || ''"
                      :min="field.min"
                      :max="field.max"
                      :step="field.step"
                    />
                  </label>
                </template>
              </form>
            </template>

            <div class="modal-error" x-show="modal.error" x-text="modal.error"></div>
            <div class="modal-actions">
              <button type="button" @click="closeModal(null)" x-text="modal.cancelText || 'Cancel'"></button>
              <button
                type="button"
                :class="modal.danger ? 'danger' : 'primary'"
                @click="modal.type === 'prompt' ? submitModalPrompt() : closeModal(true)"
                x-text="modal.confirmText || 'Confirm'"
              ></button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </body>
</html>
