<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Template Lab</title>
  <link rel="stylesheet" href="/static/pad.css">
</head>
<body class="lab-route">
  <header class="topbar">
    <div class="topbar-row main-row">
      <div class="brand">
        <h1>Template Lab <span class="lab-badge">LAB</span></h1>
        <nav class="route-tabs" aria-label="Routes">
          <a href="/">Pad</a>
          <a class="active" href="/lab">Lab</a>
        </nav>
      </div>
      <form id="sessionForm" class="session-controls" aria-label="Session controls">
        <span class="panel-label">Session</span>
        <label>Beat-sync BPM <button type="button" data-step="-1" aria-label="Decrease BPM">−</button><input id="bpmInput" type="number" min="60" max="200" step="1"><button type="button" data-step="1" aria-label="Increase BPM">+</button></label>
        <span id="bpmScope" class="dim">Select a draft</span>
        <label>Test Palette <select id="paletteSelect"></select></label>
        <label class="switch">Loop <input id="loopToggle" type="checkbox"><span id="loopLabel">On</span></label>
      </form>
      <div class="transport">
        <span id="ownershipPill" class="pill">Free</span>
        <button id="ownershipBtn" type="button" class="ghost">Take over</button>
        <button id="stopBtn" type="button" class="danger" aria-label="Emergency stop">■ STOP</button>
      </div>
    </div>
  </header>
  <main>
    <div id="errorBanner" class="error-banner" hidden></div>
    <section class="lab-layout">
      <aside class="lab-list-panel">
        <div class="panel-head"><h2 class="panel-label">Drafts</h2><button id="rejectedToggle" type="button" class="ghost"></button><button id="newDraftBtn" type="button" class="primary">New</button></div>
        <div id="draftList" class="lab-list"></div>
      </aside>
      <section class="lab-detail-panel">
        <div class="panel-head">
          <div><h2 id="draftTitle">Select a draft</h2><div id="draftFn" class="mono dim"></div></div>
          <span id="labLive" class="live-chip" hidden>LIVE</span>
        </div>
        <div id="collisionBanner" class="collision-banner" hidden>
          <span>This name is now a production effect — archive the draft.</span>
          <button id="archiveBtn" type="button" class="ghost">Archive draft</button>
        </div>
        <label>Brief <textarea id="briefInput" rows="3"></textarea></label>
        <label>Notes <textarea id="notesInput" rows="4"></textarea></label>
        <div class="lab-meta"><span id="kindText" class="mono"></span><span id="timingText" class="badge"></span><span id="statusText" class="status-pill">iterating</span></div>
        <div id="paramControls" class="param-controls"></div>
        <div id="slotSwatches" class="slot-swatches" aria-label="Test palette slot colors"></div>
        <details class="advanced-panel">
          <summary>Advanced (raw JSON)</summary>
          <label>Params JSON <textarea id="paramsInput" class="mono" rows="8"></textarea></label>
        </details>
        <div class="editor-transport lab-actions">
          <div class="cue-wrap"><span class="panel-label">Cue length (beats)</span><div class="cue-group" role="group" aria-label="Cue length (beats)"></div></div>
          <button id="saveDraftBtn" type="button" class="primary">Save</button>
          <span id="labDirtyChip" class="dim" aria-live="polite"></span>
          <button id="playDraftBtn" type="button" class="primary">▶ Play</button>
          <button id="stopDraftBtn" type="button" class="ghost">■ Stop</button>
          <button id="reloadBtn" type="button" class="ghost">⟳ Reload code</button>
          <button id="acceptBtn" type="button" class="ghost">Accept</button>
          <button id="rejectBtn" type="button" class="ghost">Reject</button>
        </div>
        <div class="preview-row">
          <button id="previewBtn" type="button" class="ghost">◉ Preview</button>
          <canvas id="previewStrip" height="24" aria-label="Draft preview strip"></canvas>
        </div>
        <div id="beatMeter" class="beat-meter" hidden>
          <button id="clickToggle" type="button" class="ghost" aria-pressed="false" title="Metronome click (off by default)">🔊 off</button>
          <span id="beatDot" class="beat-dot" aria-hidden="true"></span>
          <span id="beatCounter" class="mono">—</span>
          <span id="beatHonesty" class="dim"></span>
        </div>
        <details id="tracePanel" class="trace-panel" hidden>
          <summary>Traceback</summary>
          <pre id="traceText"></pre>
        </details>
        <div class="danger-zone">
          <span class="panel-label">Danger zone</span>
          <button id="deleteBtn" type="button" class="danger ghost">Delete draft</button>
        </div>
      </section>
    </section>
  </main>
  <script src="/static/pad-core.js"></script>
  <script src="/static/lab.js"></script>
</body>
</html>
