[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rb_ss_bridge_v2"
version = "0.0.1"
description = "Realtime Rekordbox to SoundSwitch bridge"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyrekordbox>=0.4.4",
    "python-osc>=1.8",
    "zeroconf>=0.131",
]

[project.optional-dependencies]
dev = [
    "coverage>=7",
    "hypothesis>=6.100",
]

[tool.setuptools]
package-dir = { "rb_ss_bridge_v2" = "." }
packages = [
    "rb_ss_bridge_v2",
    "rb_ss_bridge_v2.scripts",
    "rb_ss_bridge_v2.tools",
]
py-modules = [
    "rb_ss_bridge_v2.anlz_reader",
    "rb_ss_bridge_v2.beat_math",
    "rb_ss_bridge_v2.bridge_fmt",
    "rb_ss_bridge_v2.config",
    "rb_ss_bridge_v2.diagnostics",
    "rb_ss_bridge_v2.energy_model",
    "rb_ss_bridge_v2.filepath_resolver",
    "rb_ss_bridge_v2.laser_config",
    "rb_ss_bridge_v2.laser_director",
    "rb_ss_bridge_v2.laser_executor",
    "rb_ss_bridge_v2.laser_models",
    "rb_ss_bridge_v2.live_bpm",
    "rb_ss_bridge_v2.logging_manager",
    "rb_ss_bridge_v2.midi_output",
    "rb_ss_bridge_v2.models",
    "rb_ss_bridge_v2.mtc_reader",
    "rb_ss_bridge_v2.os2l_injector",
    "rb_ss_bridge_v2.osl_output",
    "rb_ss_bridge_v2.probe_deck2",
    "rb_ss_bridge_v2.probe_live_bpm",
    "rb_ss_bridge_v2.rb_memory",
    "rb_ss_bridge_v2.rb_offsets",
    "rb_ss_bridge_v2.rb_state_reader",
    "rb_ss_bridge_v2.rb_state_shadow",
    "rb_ss_bridge_v2.runtime_status",
    "rb_ss_bridge_v2.scripted_tracks",
    "rb_ss_bridge_v2.session_recorder",
    "rb_ss_bridge_v2.session_replayer",
    "rb_ss_bridge_v2.smart_phrasing",
    "rb_ss_bridge_v2.sound_switch_engine",
    "rb_ss_bridge_v2.ss_library_scanner",
    "rb_ss_bridge_v2.state_manager",
    "rb_ss_bridge_v2.tl_tailer",
    "rb_ss_bridge_v2.validation_runner",
]

[tool.hypothesis]
derandomize = false
max_examples = 200
deadline = 1000
